<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>B.Y PRO Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Password Modal */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .password-card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 32px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(42,109,244,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        
        .password-card h2 {
            color: #2a6df4;
            margin-bottom: 8px;
            font-size: 28px;
        }
        
        .password-card p {
            color: #888;
            margin-bottom: 24px;
        }
        
        .password-card input {
            width: 100%;
            padding: 14px 18px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            transition: 0.2s;
        }
        
        .password-card input:focus {
            border-color: #2a6df4;
            box-shadow: 0 0 0 3px rgba(42,109,244,0.2);
        }
        
        .password-card button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2a6df4, #1a5be0);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .password-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(42,109,244,0.4);
        }
        
        .error-text {
            color: #e74c3c;
            margin-top: 12px;
            display: none;
        }
        
        /* Dashboard */
        .dashboard {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .admin-header h1 {
            font-size: 20px;
            font-weight: 500;
            color: white;
        }
        
        .admin-header h1 i {
            color: #2a6df4;
            margin-right: 8px;
        }
        
        /* Stats */
        .stats-container {
            display: flex;
            gap: 12px;
        }
        
        .stat-item {
            background: #1a1a1a;
            padding: 12px 20px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid #2a2a2a;
            min-width: 90px;
        }
        
        .stat-item h4 {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .stat-item .stat-value {
            font-size: 22px;
            font-weight: 600;
            color: white;
        }
        
        /* Buttons */
        .btn-refresh {
            background: #2a2a2a;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: 0.2s;
        }
        
        .btn-refresh:hover {
            background: #2a6df4;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #2a6df4, #1a5be0);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(42,109,244,0.3);
        }
        
        /* Table */
        .table-wrapper {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 20px;
            overflow-x: auto;
            border: 1px solid #2a2a2a;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 16px 12px;
            color: #888;
            font-weight: 500;
            font-size: 13px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #2a2a2a;
            vertical-align: middle;
            color: white;
        }
        
        tr:hover {
            background: #222;
        }
        
        /* Avatar */
        .avatar-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2a6df4;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .avatar-img:hover {
            transform: scale(1.05);
            border-color: white;
        }
        
        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .badge-active {
            background: rgba(46,204,113,0.2);
            color: #2ecc71;
        }
        
        .badge-blocked {
            background: rgba(231,76,60,0.2);
            color: #e74c3c;
        }
        
        /* Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }
        
        .dropdown-btn:hover {
            background: #2a2a2a;
            color: white;
        }
        
        .dropdown-menu {
            position: fixed;
            background: #2a2a2a;
            border-radius: 16px;
            min-width: 180px;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #3a3a3a;
            display: none;
        }
        
        .dropdown-menu button {
            width: 100%;
            padding: 12px 16px;
            text-align: left;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            transition: 0.2s;
        }
        
        .dropdown-menu button:hover {
            background: #3a3a3a;
        }
        
        .dropdown-menu button i {
            width: 20px;
            color: #2a6df4;
        }
        
        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1100;
        }
        
        .modal-container {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 28px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #2a6df4;
            animation: modalFadeIn 0.2s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .modal-header h3 {
            color: white;
            font-size: 20px;
        }
        
        .modal-header h3 i {
            color: #2a6df4;
            margin-right: 8px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        
        .modal-close:hover {
            color: white;
        }
        
        /* Form */
        .form-field {
            margin-bottom: 20px;
        }
        
        .form-field label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .form-field input {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        
        .form-field input:focus {
            border-color: #2a6df4;
        }
        
        .form-field input[readonly] {
            background: #222;
            color: #888;
            cursor: not-allowed;
        }
        
        /* Avatar Upload Circle */
        .avatar-upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 16px 0;
        }
        
        .avatar-preview-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2a6df4;
            background: #2a2a2a;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .avatar-preview-circle:hover {
            transform: scale(1.02);
            border-color: white;
        }
        
        .avatar-hint {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            cursor: pointer;
        }
        
        .avatar-hint i {
            color: #2a6df4;
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #2a6df4, #1a5be0);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #2a2a2a;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-secondary:hover {
            background: #3a3a3a;
        }
        
        .flex-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        /* Toast */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a6df4;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 1200;
            display: none;
            animation: toastSlideUp 0.3s ease;
            white-space: nowrap;
        }
        
        @keyframes toastSlideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        .toast-error {
            background: #e74c3c;
        }
        
        .toast-success {
            background: #2ecc71;
        }
        
        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1300;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #2a2a2a;
            border-top-color: #2a6df4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Status Message */
        .status-alert {
            background: rgba(46,204,113,0.2);
            color: #2ecc71;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        
        .status-alert.error {
            background: rgba(231,76,60,0.2);
            color: #e74c3c;
        }
        
        /* Info Box */
        .info-box {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3a3a3a;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #888;
        }
        
        .info-value {
            color: #2ecc71;
            font-weight: 500;
        }
        
        .info-value code {
            color: #2a6df4;
            background: none;
        }
    </style>
</head>
<body>
    <!-- Password Modal -->
    <div id="passwordOverlay" class="password-overlay">
        <div class="password-card">
            <h2><i class="fas fa-lock"></i> Admin Access</h2>
            <p>Enter admin password to access the system</p>
            <input type="password" id="adminPassword" placeholder="Password">
            <button id="loginAdminBtn">Access Dashboard</button>
            <div id="passwordError" class="error-text">Incorrect password</div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="admin-header">
            <h1><i class="fas fa-users-cog"></i> B.Y PRO Account Management</h1>
            <div class="stats-container">
                <div class="stat-item">
                    <h4>Total</h4>
                    <div class="stat-value" id="statTotal">0</div>
                </div>
                <div class="stat-item">
                    <h4>Balance</h4>
                    <div class="stat-value" id="statBalance">$0</div>
                </div>
                <div class="stat-item">
                    <h4>Blocked</h4>
                    <div class="stat-value" id="statBlocked">0</div>
                </div>
                <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <button class="btn-add" id="addAccountBtn"><i class="fas fa-plus"></i> Add New Account</button>
        <div id="statusAlert" class="status-alert"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Avatar</th><th>ID</th><th>Name</th><th>Email</th><th>Balance</th><th>Card</th><th>Status</th><th></th>
                    </tr>
                </thead>
                <tbody id="accountsTable">
                    <tr><td colspan="8" style="text-align:center; padding:60px;"><i class="fas fa-spinner fa-spin"></i> Loading accounts...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Modal -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus"></i> Add Account</h3>
                <button class="modal-close" onclick="closeModal('addModal')">&times;</button>
            </div>
            <div class="form-field"><label>Name</label><input type="text" id="addName"></div>
            <div class="form-field"><label>Email</label><input type="email" id="addEmail"></div>
            <div class="form-field"><label>Password</label><input type="text" id="addPassword"></div>
            <div class="avatar-upload-area">
                <img id="addAvatarPreview" class="avatar-preview-circle" src="https://i.ibb.co/SDxkt40s/user.png" onclick="document.getElementById('addAvatarFile').click()">
                <input type="file" id="addAvatarFile" accept="image/*" style="display:none">
                <div class="avatar-hint" onclick="document.getElementById('addAvatarFile').click()"><i class="fas fa-camera"></i> Click to change avatar</div>
            </div>
            <div class="flex-row">
                <button class="btn-secondary" onclick="closeModal('addModal')">Cancel</button>
                <button class="btn-primary" id="confirmAddBtn">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Edit Account</h3>
                <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
            </div>
            <div class="form-field"><label>ID</label><input type="text" id="editId"></div>
            <div class="form-field"><label>Name</label><input type="text" id="editName"></div>
            <div class="form-field"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="form-field"><label>New Password</label><input type="text" id="editNewPwd" placeholder="Leave empty to keep current"></div>
            <div class="form-field"><label>Current Password</label><input type="text" id="editCurrentPwd" readonly></div>
            <div class="avatar-upload-area">
                <img id="editAvatarPreview" class="avatar-preview-circle" src="https://i.ibb.co/SDxkt40s/user.png" onclick="document.getElementById('editAvatarFile').click()">
                <input type="file" id="editAvatarFile" accept="image/*" style="display:none">
                <div class="avatar-hint" onclick="document.getElementById('editAvatarFile').click()"><i class="fas fa-camera"></i> Change avatar</div>
            </div>
            <div class="flex-row">
                <button class="btn-secondary" onclick="closeModal('editModal')">Cancel</button>
                <button class="btn-primary" id="saveEditBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Financial Modal -->
    <div id="financialModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-wallet"></i> Financial Details</h3>
                <button class="modal-close" onclick="closeModal('financialModal')">&times;</button>
            </div>
            <div id="financialInfo"></div>
            <div class="form-field"><label>Update Balance ($)</label><input type="number" id="financialAmount" step="0.01"></div>
            <div class="form-field"><label>Action</label><select id="financialAction"><option value="add">Add to Balance</option><option value="set">Set New Balance</option></select></div>
            <div class="form-field"><label>Card Code</label><input type="text" id="financialCardCode"></div>
            <div class="flex-row">
                <button class="btn-secondary" onclick="closeModal('financialModal')">Cancel</button>
                <button class="btn-primary" id="saveFinancialBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qrModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-qrcode"></i> Login QR Code</h3>
                <button class="modal-close" onclick="closeModal('qrModal')">&times;</button>
            </div>
            <div id="qrCodeDisplay" style="text-align:center; padding:20px;"></div>
            <div class="form-field"><input type="text" id="qrDataText" readonly style="font-family:monospace; font-size:12px;"></div>
            <button class="btn-secondary" onclick="copyQRData()" style="width:100%"><i class="fas fa-copy"></i> Copy QR Data</button>
        </div>
    </div>

    <!-- Loading & Toast -->
    <div id="loadingOverlay" class="loading-overlay"><div class="loading-spinner"></div></div>
    <div id="toastMessage" class="toast-message"></div>

    <script>
        const API_BASE = 'https://b-y-pro-acounts-login.onrender.com/api';
        const INTERNAL_KEY = 'bypro-internal-key-2025';
        const ADMIN_PWD = '20070909';

        let allAccounts = [];
        let currentEditId = null;
        let currentFinancialId = null;
        let addAvatarFile = null;
        let editAvatarFile = null;

        // ==================== UI Helpers ====================
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = msg;
            toast.className = `toast-message ${isError ? 'toast-error' : 'toast-success'}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('statusAlert');
            el.textContent = msg;
            el.className = isError ? 'status-alert error' : 'status-alert';
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // ==================== API Calls ====================
        async function callAPI(endpoint, method = 'GET', data = null, isFormData = false) {
            const options = { method, headers: {} };
            if (!isFormData) options.headers['Content-Type'] = 'application/json';
            options.headers['x-api-key'] = INTERNAL_KEY;
            if (data) options.body = isFormData ? data : JSON.stringify(data);
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (!response.ok) throw new Error((await response.json().catch(()=>({}))).error || `HTTP ${response.status}`);
            return await response.json();
        }

        async function fetchFinancial(userId) {
            try { return (await callAPI(`/financial/${userId}`)).data; } catch { return { balance: 0, cardCode: 'Not set', transactions: [] }; }
        }

        async function uploadAvatar(accountId, file) {
            const formData = new FormData();
            formData.append('avatar', file);
            const response = await fetch(`${API_BASE}/accounts/${accountId}/avatar`, {
                method: 'POST', headers: { 'x-api-key': INTERNAL_KEY }, body: formData
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.error);
            return data.avatarUrl;
        }

        // ==================== Dropdown Menu ====================
        function createDropdown(accountId, isBlocked) {
            const container = document.createElement('div');
            container.className = 'dropdown';
            
            const btn = document.createElement('button');
            btn.className = 'dropdown-btn';
            btn.innerHTML = '<i class="fas fa-ellipsis-v"></i>';
            
            const menu = document.createElement('div');
            menu.className = 'dropdown-menu';
            const blockedStatus = isBlocked === true;
            menu.innerHTML = `
                <button onclick="openEditAccount('${accountId}'); event.stopPropagation();"><i class="fas fa-edit"></i> Edit Account</button>
                <button onclick="openFinancialModal('${accountId}'); event.stopPropagation();"><i class="fas fa-wallet"></i> Financial</button>
                <button onclick="generateQRCode('${accountId}'); event.stopPropagation();"><i class="fas fa-qrcode"></i> QR Code</button>
                <button onclick="toggleAccountBlock('${accountId}', ${!blockedStatus}); event.stopPropagation();"><i class="fas ${blockedStatus ? 'fa-unlock' : 'fa-ban'}"></i> ${blockedStatus ? 'Unblock' : 'Block'}</button>
                <button onclick="deleteAccountById('${accountId}'); event.stopPropagation();"><i class="fas fa-trash"></i> Delete</button>
            `;
            
            const showMenu = (e) => {
                e.preventDefault();
                e.stopPropagation();
                document.querySelectorAll('.dropdown').forEach(d => {
                    if (d !== container) {
                        d.classList.remove('show');
                        const m = d.querySelector('.dropdown-menu');
                        if (m) m.style.display = 'none';
                    }
                });
                container.classList.toggle('show');
                if (container.classList.contains('show')) {
                    menu.style.display = 'block';
                    const rect = btn.getBoundingClientRect();
                    menu.style.top = rect.bottom + window.scrollY + 'px';
                    menu.style.left = rect.left + window.scrollX - menu.offsetWidth + rect.width + 'px';
                } else {
                    menu.style.display = 'none';
                }
            };
            
            btn.onclick = showMenu;
            btn.ontouchstart = showMenu;
            
            container.appendChild(btn);
            container.appendChild(menu);
            return container;
        }

        // ==================== Load Accounts ====================
        async function loadAccounts() {
            showLoading(true);
            try {
                const result = await callAPI('/get-all-accounts');
                let accounts = result.accounts || [];
                let totalBalance = 0, blockedCount = 0;
                
                const processed = [];
                for (const acc of accounts) {
                    const financial = await fetchFinancial(acc.id);
                    const safe = {
                        id: acc.id,
                        name: acc.name || 'No Name',
                        email: acc.email || 'No Email',
                        blocked: acc.blocked === true,
                        avatar: acc.avatar || 'https://i.ibb.co/SDxkt40s/user.png',
                        balance: financial?.balance || 0,
                        cardCode: financial?.cardCode || 'Not set'
                    };
                    totalBalance += safe.balance;
                    if (safe.blocked) blockedCount++;
                    processed.push(safe);
                }
                
                allAccounts = processed;
                document.getElementById('statTotal').textContent = processed.length;
                document.getElementById('statBalance').textContent = `$${totalBalance.toFixed(2)}`;
                document.getElementById('statBlocked').textContent = blockedCount;
                
                const tbody = document.getElementById('accountsTable');
                tbody.innerHTML = '';
                
                processed.forEach(acc => {
                    const row = document.createElement('tr');
                    
                    const avatarCell = document.createElement('td');
                    const avatar = document.createElement('img');
                    avatar.className = 'avatar-img';
                    avatar.src = acc.avatar;
                    avatar.onerror = () => avatar.src = 'https://i.ibb.co/SDxkt40s/user.png';
                    avatar.onclick = () => openEditAccount(acc.id);
                    avatarCell.appendChild(avatar);
                    row.appendChild(avatarCell);
                    
                    const idCell = document.createElement('td');
                    idCell.innerHTML = `<strong>${acc.id}</strong>`;
                    row.appendChild(idCell);
                    
                    const nameCell = document.createElement('td');
                    nameCell.textContent = acc.name;
                    row.appendChild(nameCell);
                    
                    const emailCell = document.createElement('td');
                    emailCell.textContent = acc.email;
                    row.appendChild(emailCell);
                    
                    const balanceCell = document.createElement('td');
                    balanceCell.style.color = '#2ecc71';
                    balanceCell.textContent = `$${acc.balance.toFixed(2)}`;
                    row.appendChild(balanceCell);
                    
                    const cardCell = document.createElement('td');
                    cardCell.innerHTML = `<code style="font-size:11px;">${acc.cardCode}</code>`;
                    row.appendChild(cardCell);
                    
                    const statusCell = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = `badge ${acc.blocked ? 'badge-blocked' : 'badge-active'}`;
                    badge.textContent = acc.blocked ? 'BLOCKED' : 'ACTIVE';
                    statusCell.appendChild(badge);
                    row.appendChild(statusCell);
                    
                    const actionsCell = document.createElement('td');
                    actionsCell.appendChild(createDropdown(acc.id, acc.blocked));
                    row.appendChild(actionsCell);
                    
                    tbody.appendChild(row);
                });
                
            } catch (error) {
                showStatus('Error: ' + error.message, true);
                document.getElementById('accountsTable').innerHTML = `<tr><td colspan="8" style="text-align:center; padding:60px;">Error: ${error.message}</td></tr>`;
            } finally {
                showLoading(false);
            }
        }

        // ==================== Account Actions ====================
        window.openEditAccount = async (id) => {
            const acc = allAccounts.find(a => a.id === id);
            if (!acc) return;
            currentEditId = id;
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = acc.name;
            document.getElementById('editEmail').value = acc.email;
            document.getElementById('editNewPwd').value = '';
            document.getElementById('editAvatarPreview').src = acc.avatar;
            editAvatarFile = null;
            try {
                const full = await callAPI(`/accounts/${id}`);
                if (full.success && full.account) {
                    document.getElementById('editCurrentPwd').value = full.account.password || 'Not available';
                } else {
                    document.getElementById('editCurrentPwd').value = 'Not available';
                }
            } catch {
                document.getElementById('editCurrentPwd').value = 'Error loading';
            }
            document.getElementById('editModal').style.display = 'flex';
        };
        
        window.saveEditAccount = async () => {
            const id = document.getElementById('editId').value.trim();
            const name = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const newPwd = document.getElementById('editNewPwd').value.trim();
            if (!name || !email) { showStatus('Name and email required', true); return; }
            const payload = { name, email };
            if (newPwd) payload.password = newPwd;
            showLoading(true);
            try {
                await callAPI(`/accounts/${id}`, 'PUT', payload);
                if (editAvatarFile) await uploadAvatar(id, editAvatarFile);
                showStatus(`Account ${id} updated`, false);
                closeModal('editModal');
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        };
        
        window.deleteAccountById = async (id) => {
            if (!confirm(`⚠️ Permanently delete account ${id}? This cannot be undone.`)) return;
            showLoading(true);
            try {
                await callAPI(`/accounts/${id}`, 'DELETE');
                showStatus(`Account ${id} deleted`, false);
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        };
        
        window.toggleAccountBlock = async (userId, block) => {
            showLoading(true);
            try {
                await callAPI(`/accounts/${userId}/block`, 'POST', { blocked: block });
                showStatus(`Account ${userId} ${block ? 'BLOCKED' : 'UNBLOCKED'}`, false);
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        };
        
        window.openFinancialModal = async (userId) => {
            currentFinancialId = userId;
            const financial = await fetchFinancial(userId);
            document.getElementById('financialInfo').innerHTML = `
                <div class="info-box">
                    <div class="info-row"><span class="info-label">💰 Balance</span><span class="info-value">$${(financial?.balance || 0).toFixed(2)}</span></div>
                    <div class="info-row"><span class="info-label">💳 Card Code</span><span class="info-value"><code>${financial?.cardCode || 'Not set'}</code></span></div>
                    <div class="info-row"><span class="info-label">📅 Last Transaction</span><span class="info-value">${financial?.transactions?.[0]?.description || 'None'}</span></div>
                </div>
            `;
            document.getElementById('financialAmount').value = '';
            document.getElementById('financialCardCode').value = financial?.cardCode || '';
            document.getElementById('financialModal').style.display = 'flex';
        };
        
        window.saveFinancialChanges = async () => {
            const userId = currentFinancialId;
            const amount = parseFloat(document.getElementById('financialAmount').value);
            const action = document.getElementById('financialAction').value;
            const newCardCode = document.getElementById('financialCardCode').value;
            showLoading(true);
            try {
                const current = await fetchFinancial(userId);
                if (!isNaN(amount)) {
                    let newBalance = action === 'set' ? amount : current.balance + amount;
                    await callAPI('/financial/add-balance', 'POST', { userId, amount: newBalance - current.balance, description: `Admin ${action} balance` });
                }
                if (newCardCode && newCardCode !== current.cardCode) {
                    await callAPI('/financial/update-card', 'POST', { userId, cardCode: newCardCode });
                }
                showStatus('Financial data updated', false);
                closeModal('financialModal');
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        };
        
        window.generateQRCode = async (userId) => {
            try {
                const account = await callAPI(`/accounts/${userId}`);
                const qrText = `BYPRO:${account.account.id}:${account.account.password}`;
                const container = document.getElementById('qrCodeDisplay');
                container.innerHTML = '';
                new QRCode(container, { text: qrText, width: 180, height: 180, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
                document.getElementById('qrDataText').value = qrText;
                document.getElementById('qrModal').style.display = 'flex';
            } catch (error) { showStatus('Error generating QR: ' + error.message, true); }
        };
        
        window.copyQRData = () => {
            const data = document.getElementById('qrDataText');
            data.select();
            document.execCommand('copy');
            showToast('QR data copied to clipboard');
        };
        
        window.addNewAccount = async () => {
            const name = document.getElementById('addName').value.trim();
            const email = document.getElementById('addEmail').value.trim();
            const password = document.getElementById('addPassword').value.trim();
            if (!name || !email || !password) { showStatus('All fields required', true); return; }
            showLoading(true);
            try {
                const result = await callAPI('/create-account', 'POST', { name, email, password });
                const newId = result.account.id;
                if (addAvatarFile) await uploadAvatar(newId, addAvatarFile);
                showStatus(`Account ${newId} created!`, false);
                closeModal('addModal');
                document.getElementById('addName').value = '';
                document.getElementById('addEmail').value = '';
                document.getElementById('addPassword').value = '';
                addAvatarFile = null;
                document.getElementById('addAvatarPreview').src = 'https://i.ibb.co/SDxkt40s/user.png';
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        };
        
        // ==================== Avatar Handlers ====================
        function handleAddAvatar(file) {
            if (!file) return;
            if (!file.type.match('image.*')) { showStatus('Select an image file', true); return; }
            if (file.size > 5*1024*1024) { showStatus('Max 5MB', true); return; }
            addAvatarFile = file;
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('addAvatarPreview').src = e.target.result; };
            reader.readAsDataURL(file);
        }
        
        function handleEditAvatar(file) {
            if (!file) return;
            if (!file.type.match('image.*')) { showStatus('Select an image file', true); return; }
            if (file.size > 5*1024*1024) { showStatus('Max 5MB', true); return; }
            editAvatarFile = file;
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('editAvatarPreview').src = e.target.result; };
            reader.readAsDataURL(file);
        }
        
        // ==================== Event Listeners ====================
        document.getElementById('loginAdminBtn').onclick = () => {
            if (document.getElementById('adminPassword').value === ADMIN_PWD) {
                document.getElementById('passwordOverlay').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAccounts();
            } else {
                document.getElementById('passwordError').style.display = 'block';
            }
        };
        document.getElementById('adminPassword').onkeypress = e => e.key === 'Enter' && document.getElementById('loginAdminBtn').click();
        document.getElementById('refreshBtn').onclick = loadAccounts;
        document.getElementById('addAccountBtn').onclick = () => document.getElementById('addModal').style.display = 'flex';
        document.getElementById('confirmAddBtn').onclick = addNewAccount;
        document.getElementById('saveEditBtn').onclick = window.saveEditAccount;
        document.getElementById('saveFinancialBtn').onclick = window.saveFinancialChanges;
        document.getElementById('addAvatarFile').onchange = e => handleAddAvatar(e.target.files[0]);
        document.getElementById('editAvatarFile').onchange = e => handleEditAvatar(e.target.files[0]);
        
        // Close dropdowns on click outside
        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown').forEach(d => {
                d.classList.remove('show');
                const menu = d.querySelector('.dropdown-menu');
                if (menu) menu.style.display = 'none';
            });
        });
    </script>
</body>
</html>
