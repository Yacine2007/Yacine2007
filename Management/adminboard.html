<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Y PRO - Admin Dashboard (Full Control)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --dark: #2980b9;
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --text: #ffffff;
            --muted: #8a8a8a;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --radius: 10px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

        /* Password Modal */
        .password-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center;
            align-items: center; z-index: 1000;
        }

        .password-box {
            background: var(--card); padding: 40px; border-radius: var(--radius);
            width: 90%; max-width: 450px; border: 1px solid var(--primary);
            text-align: center; box-shadow: var(--shadow);
            position: relative;
        }

        .password-box::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--dark));
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .password-box h2 { margin-bottom: 10px; color: var(--primary); }
        .password-box p { color: var(--muted); margin-bottom: 25px; font-size: 15px; }

        .password-box input, .password-box button {
            width: 100%; padding: 14px; margin-bottom: 15px;
            border-radius: var(--radius); font-size: 16px; transition: all 0.3s;
        }

        .password-box input {
            background: rgba(255, 255, 255, 0.05); color: var(--text); 
            border: 1px solid var(--muted); outline: none;
        }

        .password-box input:focus {
            border-color: var(--primary); box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .password-box button {
            background: linear-gradient(135deg, var(--primary), var(--dark)); 
            color: white; border: none; cursor: pointer; font-weight: 600;
        }

        .error { 
            color: var(--danger); margin-top: 10px; display: none; 
            background: rgba(231, 76, 60, 0.1); padding: 10px; border-radius: 5px;
        }

        /* Dashboard */
        .dashboard { display: none; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap; gap: 20px;
        }

        .header-left h1 { 
            font-size: 28px; margin-bottom: 5px; 
            background: linear-gradient(90deg, var(--primary), #9b59b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-box {
            background: linear-gradient(145deg, var(--card), #151515);
            padding: 20px; border-radius: var(--radius); min-width: 160px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-box h3 { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
        .stat-box p { font-size: 32px; font-weight: 700; }

        /* Buttons */
        .btn {
            padding: 10px 20px; border: none; border-radius: 6px;
            cursor: pointer; display: inline-flex; align-items: center;
            gap: 8px; font-size: 14px; font-weight: 600; transition: all 0.3s;
        }

        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--dark)); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #c0392b); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #27ae60); color: white; }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #e67e22); color: white; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }

        .refresh-btn, .add-btn {
            background: linear-gradient(135deg, var(--primary), var(--dark)); 
            color: white; border: none; padding: 12px 24px; border-radius: var(--radius);
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            font-weight: 600; transition: all 0.3s;
        }

        /* Table */
        .table-container {
            background: linear-gradient(145deg, var(--card), #151515); 
            border-radius: var(--radius); padding: 25px;
            overflow-x: auto;
            box-shadow: var(--shadow);
        }

        table { width: 100%; border-collapse: collapse; }
        thead { background: linear-gradient(135deg, rgba(52, 152, 219, 0.2), rgba(41, 128, 185, 0.1)); }
        th { padding: 18px 15px; text-align: left; color: var(--primary); font-weight: 600; }
        td { padding: 16px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        tbody tr:hover { background: rgba(52, 152, 219, 0.05); transform: translateX(5px); }

        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .badge-active { background: rgba(46, 204, 113, 0.2); color: var(--success); border: 1px solid rgba(46, 204, 113, 0.3); }
        .badge-blocked { background: rgba(231, 76, 60, 0.2); color: var(--danger); border: 1px solid rgba(231, 76, 60, 0.3); }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1001; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(145deg, var(--card), #151515); 
            padding: 35px; border-radius: var(--radius);
            width: 90%; max-width: 600px; border: 1px solid var(--primary);
            max-height: 90vh; overflow-y: auto;
        }

        .modal-content::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), #9b59b6);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .modal-content h3 { margin-bottom: 25px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--muted); font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.05);
            color: var(--text); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; outline: none;
        }
        .form-group input:focus { border-color: var(--primary); }
        
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .info-label { color: var(--muted); }
        .info-value { color: var(--primary); font-weight: 600; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .status { padding: 15px; border-radius: var(--radius); text-align: center; display: none; margin-bottom: 20px; }
        .status-success { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .status-error { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
        .loading { text-align: center; padding: 60px; color: var(--muted); }
        .fa-spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h2><i class="fas fa-lock"></i> Admin Dashboard</h2>
            <p>Enter admin password to access the system</p>
            <input type="password" id="passwordInput" placeholder="Enter password">
            <button id="submitPassword"><i class="fas fa-unlock"></i> Access Dashboard</button>
            <div class="error" id="errorMessage">Incorrect password</div>
        </div>
    </div>

    <!-- Financial Details Modal -->
    <div class="modal" id="financialModal">
        <div class="modal-content">
            <h3><i class="fas fa-wallet"></i> Financial Details</h3>
            <div id="financialInfo"></div>
            <div class="form-group">
                <label>Update Balance ($)</label>
                <input type="number" id="updateBalanceAmount" step="0.01" placeholder="Enter new balance or amount to add">
                <select id="balanceAction" style="margin-top: 10px;">
                    <option value="set">Set Balance (replace)</option>
                    <option value="add">Add to Balance</option>
                </select>
            </div>
            <div class="form-group">
                <label>Update Card Code</label>
                <input type="text" id="updateCardCode" placeholder="byppcn-xxxxxxxxxxxxxxx">
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="closeFinancialModal">Close</button>
                <button class="btn btn-success" id="saveFinancialChanges">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Block/Unblock Modal -->
    <div class="modal" id="blockModal">
        <div class="modal-content">
            <h3><i class="fas fa-ban"></i> Account Status</h3>
            <div id="blockInfo"></div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="closeBlockModal">Cancel</button>
                <button class="btn btn-warning" id="confirmBlockAction">Block Account</button>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-users-cog"></i> B.Y PRO Admin Panel</h1>
                <p>Full Control - Accounts & Financial Management</p>
            </div>
            <div style="display: flex; gap: 20px;">
                <div class="stat-box"><h3>Total Accounts</h3><p id="totalAccounts">0</p></div>
                <div class="stat-box"><h3>Total Balance</h3><p id="totalBalance">$0</p></div>
                <div class="stat-box"><h3>Blocked</h3><p id="blockedCount">0</p></div>
                <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <button class="add-btn" id="addAccountBtn"><i class="fas fa-plus"></i> Add New Account</button>
        <div id="statusMessage" class="status"></div>

        <div class="table-container">
            <table>
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Balance</th><th>Card Code</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="accountsTableBody"><tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = 'https://b-y-pro-acounts-login.onrender.com/api';
        const INTERNAL_KEY = 'bypro-internal-key-2025';
        const ADMIN_PASSWORD = '20070909';

        let accountsData = [];
        let financialDataCache = {};
        let blockedAccounts = JSON.parse(localStorage.getItem('blockedAccounts') || '[]');
        let currentFinancialUserId = null;

        function saveBlockedToStorage() { localStorage.setItem('blockedAccounts', JSON.stringify(blockedAccounts)); }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `status status-${type}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        async function callAPI(endpoint, method = 'GET', data = null) {
            const options = { method, headers: { 'Content-Type': 'application/json', 'x-api-key': INTERNAL_KEY } };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        }

        async function fetchFinancialData(userId) {
            try {
                const result = await callAPI(`/financial/${userId}`);
                if (result.success) return result.data;
            } catch (e) { console.warn('No financial data:', e.message); }
            return { id: userId, name: '', email: '', balance: 0, cardCode: 'Not available', transactions: [] };
        }

        async function updateFinancialData(userId, updates) {
            if (updates.balance !== undefined) {
                const current = await fetchFinancialData(userId);
                const newBalance = updates.balance;
                await callAPI('/financial/add-balance', 'POST', { userId, amount: newBalance - current.balance, description: 'Admin update' });
            }
            if (updates.cardCode) {
                await callAPI('/financial/update-card', 'POST', { userId, cardCode: updates.cardCode });
            }
        }

        async function loadAccounts() {
            const tbody = document.getElementById('accountsTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';
            try {
                const authResult = await callAPI('/get-all-accounts');
                if (!authResult.success) throw new Error(authResult.error);
                
                const accounts = authResult.accounts || [];
                let totalBalance = 0;
                
                for (const acc of accounts) {
                    const financial = await fetchFinancialData(acc.id);
                    financialDataCache[acc.id] = financial;
                    acc.balance = financial?.balance || 0;
                    acc.cardCode = financial?.cardCode || 'Not set';
                    totalBalance += acc.balance || 0;
                }
                
                accountsData = accounts;
                document.getElementById('totalAccounts').textContent = accounts.length;
                document.getElementById('totalBalance').textContent = `$${totalBalance.toFixed(2)}`;
                document.getElementById('blockedCount').textContent = blockedAccounts.length;
                
                tbody.innerHTML = accounts.map(acc => {
                    const isBlocked = blockedAccounts.includes(acc.id);
                    return `
                        <tr style="${isBlocked ? 'opacity: 0.6;' : ''}">
                            <td><strong style="color: var(--primary);">${acc.id}</strong></td>
                            <td>${acc.name || 'No Name'}</td>
                            <td>${acc.email || 'No Email'}</td>
                            <td style="color: var(--success);">$${(acc.balance || 0).toFixed(2)}</td>
                            <td><code style="font-size: 12px;">${acc.cardCode || 'Not set'}</code></td>
                            <td><span class="badge ${isBlocked ? 'badge-blocked' : 'badge-active'}">${isBlocked ? 'BLOCKED' : 'ACTIVE'}</span></td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="openFinancialModal('${acc.id}')"><i class="fas fa-wallet"></i> Finance</button>
                                <button class="btn btn-warning btn-sm" onclick="toggleBlock('${acc.id}', ${!isBlocked})"><i class="fas ${isBlocked ? 'fa-unlock' : 'fa-ban'}"></i> ${isBlocked ? 'Unblock' : 'Block'}</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</td></tr>`;
                showStatus('Error loading accounts: ' + error.message, 'error');
            }
        }

        async function openFinancialModal(userId) {
            currentFinancialUserId = userId;
            const financial = await fetchFinancialData(userId);
            document.getElementById('financialInfo').innerHTML = `
                <div class="info-row"><span class="info-label">Current Balance</span><span class="info-value">$${(financial?.balance || 0).toFixed(2)}</span></div>
                <div class="info-row"><span class="info-label">Card Code</span><span class="info-value"><code>${financial?.cardCode || 'Not set'}</code></span></div>
                <div class="info-row"><span class="info-label">Last Transaction</span><span class="info-value">${financial?.transactions?.[0]?.description || 'None'}</span></div>
            `;
            document.getElementById('updateBalanceAmount').value = '';
            document.getElementById('updateCardCode').value = financial?.cardCode || '';
            document.getElementById('financialModal').style.display = 'flex';
        }

        async function saveFinancialChanges() {
            const userId = currentFinancialUserId;
            const amountInput = document.getElementById('updateBalanceAmount').value;
            const action = document.getElementById('balanceAction').value;
            const newCardCode = document.getElementById('updateCardCode').value;
            
            try {
                const current = await fetchFinancialData(userId);
                let newBalance = current.balance;
                
                if (amountInput) {
                    const amount = parseFloat(amountInput);
                    if (!isNaN(amount)) {
                        if (action === 'set') newBalance = amount;
                        else newBalance = current.balance + amount;
                        await callAPI('/financial/add-balance', 'POST', { userId, amount: newBalance - current.balance, description: `Admin ${action} balance` });
                    }
                }
                
                if (newCardCode && newCardCode !== current.cardCode) {
                    await callAPI('/financial/update-card', 'POST', { userId, cardCode: newCardCode });
                }
                
                showStatus('Financial data updated successfully!', 'success');
                document.getElementById('financialModal').style.display = 'none';
                loadAccounts();
            } catch (error) {
                showStatus('Error updating: ' + error.message, 'error');
            }
        }

        function toggleBlock(userId, block) {
            if (block) {
                if (!blockedAccounts.includes(userId)) blockedAccounts.push(userId);
            } else {
                blockedAccounts = blockedAccounts.filter(id => id !== userId);
            }
            saveBlockedToStorage();
            loadAccounts();
            showStatus(`Account ${userId} ${block ? 'blocked' : 'unblocked'}`, 'success');
        }

        async function addAccount() {
            const name = prompt('Enter full name:');
            if (!name) return;
            const email = prompt('Enter email:');
            if (!email) return;
            const password = prompt('Enter password:');
            if (!password) return;
            
            try {
                const nextId = await callAPI('/next-id');
                const newId = nextId.nextId || '1001';
                await callAPI('/create-account', 'POST', { id: newId, name, email, password, otpCode: '123456' });
                showStatus(`Account ${newId} created!`, 'success');
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // Authentication
        document.getElementById('submitPassword').onclick = () => {
            if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAccounts();
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        };
        document.getElementById('passwordInput').onkeypress = e => e.key === 'Enter' && document.getElementById('submitPassword').click();
        document.getElementById('refreshBtn').onclick = loadAccounts;
        document.getElementById('addAccountBtn').onclick = addAccount;
        document.getElementById('closeFinancialModal').onclick = () => document.getElementById('financialModal').style.display = 'none';
        document.getElementById('saveFinancialChanges').onclick = saveFinancialChanges;
        document.getElementById('closeBlockModal').onclick = () => document.getElementById('blockModal').style.display = 'none';

        window.openFinancialModal = openFinancialModal;
        window.toggleBlock = toggleBlock;
    </script>
</body>
</html>
