<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Y PRO - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --dark: #2980b9;
            --bg: #000000;
            --card: #111111;
            --text: #ffffff;
            --muted: #bdc3c7;
            --danger: #e74c3c;
            --success: #2ecc71;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

        .password-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center;
            align-items: center; z-index: 1000;
        }

        .password-box {
            background: var(--card); padding: 30px; border-radius: var(--radius);
            width: 90%; max-width: 400px; border: 1px solid var(--muted);
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .password-box input, .password-box button {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border-radius: var(--radius); font-size: 16px;
        }

        .password-box input {
            background: var(--bg); color: var(--text); border: 1px solid var(--muted);
        }

        .password-box button {
            background: var(--primary); color: white; border: none; cursor: pointer;
        }

        .error { color: var(--danger); margin-top: 10px; display: none; }

        .dashboard { display: none; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--muted);
            flex-wrap: wrap; gap: 15px;
        }

        .stats { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-box {
            background: var(--card); padding: 15px 20px; border-radius: var(--radius);
            min-width: 150px; text-align: center; border: 1px solid var(--muted);
        }

        .stat-box h3 { font-size: 14px; color: var(--muted); margin-bottom: 5px; }
        .stat-box p { font-size: 24px; font-weight: bold; color: var(--primary); }

        .table-container {
            background: var(--card); border-radius: var(--radius); padding: 20px;
            overflow-x: auto; border: 1px solid var(--muted);
        }

        table { width: 100%; border-collapse: collapse; }
        thead { background: linear-gradient(135deg, var(--primary), var(--dark)); }
        th { padding: 15px; text-align: left; color: white; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--muted); }
        tbody tr:hover { background: rgba(255,255,255,0.05); }

        .btn {
            padding: 8px 15px; border: none; border-radius: 4px;
            cursor: pointer; display: inline-flex; align-items: center;
            gap: 5px; font-size: 14px; margin: 2px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }

        .refresh-btn, .add-btn {
            background: var(--primary); color: white; border: none;
            padding: 10px 20px; border-radius: var(--radius); cursor: pointer;
            display: flex; align-items: center; gap: 8px; font-size: 14px;
        }

        .add-btn { margin-bottom: 20px; }
        .loading { text-align: center; padding: 40px; color: var(--muted); }
        .fa-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status {
            padding: 10px; margin: 10px 0; border-radius: 4px;
            text-align: center; display: none;
        }

        .status-success { background: rgba(46, 204, 113, 0.2); color: var(--success); border: 1px solid var(--success); }
        .status-error { background: rgba(231, 76, 60, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1001; justify-content: center; align-items: center;
        }

        .modal-content {
            background: var(--card); padding: 30px; border-radius: var(--radius);
            width: 90%; max-width: 500px; border: 1px solid var(--muted);
        }

        .modal-actions {
            display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Password Modal -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h2><i class="fas fa-lock"></i> Admin Dashboard</h2>
            <p style="color: var(--muted); margin-bottom: 20px;">
                Enter admin password to access the system
            </p>
            <input type="password" id="passwordInput" placeholder="Enter password">
            <button id="submitPassword"><i class="fas fa-unlock"></i> Access</button>
            <div class="error" id="errorMessage">
                <i class="fas fa-exclamation-triangle"></i> Incorrect password
            </div>
        </div>
    </div>

    <!-- Edit Account Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3><i class="fas fa-edit"></i> Edit Account</h3>
            <div style="margin: 20px 0;">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: var(--muted);">Name</label>
                    <input type="text" id="editName" style="width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--muted); border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: var(--muted);">Email</label>
                    <input type="email" id="editEmail" style="width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--muted); border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: var(--muted);">Password</label>
                    <input type="text" id="editPassword" style="width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--muted); border-radius: 4px;">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="cancelEdit">Cancel</button>
                <button class="btn btn-success" id="saveEdit">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <div>
                <h1><i class="fas fa-users-cog"></i> B.Y PRO Account Management</h1>
                <p style="color: var(--muted); font-size: 14px;">
                    Google Drive Database - Connected to Render Server
                </p>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="stats">
                    <div class="stat-box">
                        <h3>Total Accounts</h3>
                        <p id="totalAccounts">0</p>
                    </div>
                    <div class="stat-box">
                        <h3>With Images</h3>
                        <p id="accountsWithImages">0</p>
                    </div>
                    <div class="stat-box">
                        <h3>Server Status</h3>
                        <p id="serverStatus" style="color: var(--success);">Online</p>
                    </div>
                </div>
                <button class="refresh-btn" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <button class="add-btn" id="addAccountBtn">
            <i class="fas fa-plus"></i> Add New Account
        </button>

        <div id="statusMessage" class="status"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Password</th>
                        <th>Image</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="accountsTableBody">
                    <tr>
                        <td colspan="6" class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const API_BASE = 'https://b-y-pro-acounts-login.onrender.com/api';
        const API_KEY = 'BYPRO_SECURE_KEY_2007';
        const ADMIN_PASSWORD = '20070909';

        // ==================== STATE MANAGEMENT ====================
        let currentEditId = null;
        let accountsData = [];

        // ==================== DOM ELEMENTS ====================
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const submitPassword = document.getElementById('submitPassword');
        const errorMessage = document.getElementById('errorMessage');
        const dashboard = document.getElementById('dashboard');
        const accountsTableBody = document.getElementById('accountsTableBody');
        const totalAccountsElement = document.getElementById('totalAccounts');
        const accountsWithImagesElement = document.getElementById('accountsWithImages');
        const serverStatusElement = document.getElementById('serverStatus');
        const refreshBtn = document.getElementById('refreshBtn');
        const addAccountBtn = document.getElementById('addAccountBtn');
        const statusMessage = document.getElementById('statusMessage');
        const editModal = document.getElementById('editModal');
        const editName = document.getElementById('editName');
        const editEmail = document.getElementById('editEmail');
        const editPassword = document.getElementById('editPassword');
        const cancelEdit = document.getElementById('cancelEdit');
        const saveEdit = document.getElementById('saveEdit');

        // ==================== UTILITY FUNCTIONS ====================
        function showStatus(message, type = 'success') {
            statusMessage.textContent = message;
            statusMessage.className = `status status-${type}`;
            statusMessage.style.display = 'block';
            
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 3000);
        }

        function hideModal(modal) {
            modal.style.display = 'none';
        }

        function showModal(modal) {
            modal.style.display = 'flex';
        }

        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    serverStatusElement.textContent = 'Online';
                    serverStatusElement.style.color = 'var(--success)';
                    return true;
                }
            } catch (error) {
                serverStatusElement.textContent = 'Offline';
                serverStatusElement.style.color = 'var(--danger)';
            }
            return false;
        }

        // ==================== API FUNCTIONS ====================
        async function callAPI(endpoint, method = 'GET', data = null) {
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'API-Key': API_KEY
                    }
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(`${API_BASE}${endpoint}`, options);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // ==================== ACCOUNT FUNCTIONS ====================
        async function loadAccounts() {
            try {
                accountsTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading accounts...
                        </td>
                    </tr>
                `;

                const serverOnline = await checkServerStatus();
                if (!serverOnline) {
                    throw new Error('Server is offline');
                }

                const result = await callAPI('/accounts');
                
                if (result.success && result.accounts) {
                    accountsData = result.accounts;
                    displayAccounts(result.accounts);
                    updateStats(result.accounts);
                    showStatus(`Loaded ${result.accounts.length} accounts`, 'success');
                } else {
                    throw new Error(result.error || 'Failed to load accounts');
                }
                
            } catch (error) {
                console.error('Load error:', error);
                accountsTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="loading">
                            <i class="fas fa-exclamation-triangle"></i> 
                            Error: ${error.message}
                        </td>
                    </tr>
                `;
                showStatus('Error: ' + error.message, 'error');
            }
        }

        function displayAccounts(accounts) {
            accountsTableBody.innerHTML = '';
            
            if (!accounts || accounts.length === 0) {
                accountsTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="loading">
                            <i class="fas fa-users"></i> No accounts found
                        </td>
                    </tr>
                `;
                return;
            }
            
            accounts.forEach(account => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td><strong>${account.id}</strong></td>
                    <td>${account.name || 'No Name'}</td>
                    <td>${account.email || 'No Email'}</td>
                    <td>${'•'.repeat(Math.min(8, account.password?.length || 8))}</td>
                    <td>${account.hasImage ? '<i class="fas fa-check" style="color: var(--success);"></i>' : '<i class="fas fa-times" style="color: var(--danger);"></i>'}</td>
                    <td>
                        <button class="btn btn-primary" onclick="openEditModal('${account.id}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-danger" onclick="deleteAccount('${account.id}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                `;
                
                accountsTableBody.appendChild(row);
            });
        }

        function updateStats(accounts) {
            totalAccountsElement.textContent = accounts.length;
            const withImages = accounts.filter(acc => acc.hasImage).length;
            accountsWithImagesElement.textContent = withImages;
        }

        async function addAccount() {
            try {
                // Get next available ID
                const nextIdResult = await callAPI('/next-id');
                const newId = nextIdResult.nextId || '1000';
                
                // Get account details
                const name = prompt('Enter name:', 'New User');
                if (!name) return;
                
                const email = prompt('Enter email:', `user${newId}@bypro.com`);
                if (!email) return;
                
                const password = prompt('Enter password:', 'password123');
                if (!password) return;
                
                // Create account
                const result = await callAPI('/accounts', 'POST', {
                    id: newId,
                    name: name,
                    email: email,
                    password: password
                });
                
                if (result.success) {
                    showStatus('Account added successfully!', 'success');
                    loadAccounts();
                } else {
                    showStatus('Error: ' + result.error, 'error');
                }
                
            } catch (error) {
                showStatus('Error adding account: ' + error.message, 'error');
            }
        }

        function openEditModal(id) {
            const account = accountsData.find(acc => acc.id === id);
            if (!account) return;
            
            currentEditId = id;
            editName.value = account.name || '';
            editEmail.value = account.email || '';
            editPassword.value = account.password || '';
            showModal(editModal);
        }

        async function saveAccountChanges() {
            try {
                if (!currentEditId) return;
                
                const name = editName.value.trim();
                const email = editEmail.value.trim();
                const password = editPassword.value.trim();
                
                if (!name || !email || !password) {
                    showStatus('All fields are required', 'error');
                    return;
                }
                
                const result = await callAPI(`/accounts/${currentEditId}`, 'PUT', {
                    name: name,
                    email: email,
                    password: password
                });
                
                if (result.success) {
                    showStatus('Account updated successfully!', 'success');
                    hideModal(editModal);
                    loadAccounts();
                } else {
                    showStatus('Error: ' + result.error, 'error');
                }
                
            } catch (error) {
                showStatus('Error updating account: ' + error.message, 'error');
            }
        }

        async function deleteAccount(id) {
            if (!confirm(`Are you sure you want to delete account ${id}? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const result = await callAPI(`/accounts/${id}`, 'DELETE');
                
                if (result.success) {
                    showStatus(`Account ${id} deleted successfully`, 'success');
                    loadAccounts();
                } else {
                    showStatus('Error: ' + result.error, 'error');
                }
                
            } catch (error) {
                showStatus('Error deleting account: ' + error.message, 'error');
            }
        }

        // ==================== EVENT LISTENERS ====================
        submitPassword.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                passwordModal.style.display = 'none';
                dashboard.style.display = 'block';
                loadAccounts();
            } else {
                errorMessage.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitPassword.click();
            }
        });

        refreshBtn.addEventListener('click', loadAccounts);
        addAccountBtn.addEventListener('click', addAccount);
        cancelEdit.addEventListener('click', () => hideModal(editModal));
        saveEdit.addEventListener('click', saveAccountChanges);

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === editModal) {
                hideModal(editModal);
            }
        });

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 B.Y PRO Dashboard Initialized');
            console.log('🔗 Server URL:', API_BASE);
            console.log('🔐 API Key:', API_KEY ? 'Loaded' : 'Missing');
            
            passwordModal.style.display = 'flex';
            passwordInput.focus();
            
            // Check server status on load
            checkServerStatus();
        });

        // Global functions for HTML event handlers
        window.openEditModal = openEditModal;
        window.deleteAccount = deleteAccount;
    </script>
</body>
</html>
