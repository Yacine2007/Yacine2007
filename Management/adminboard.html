<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>B.Y PRO - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --dark: #2980b9;
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --text: #ffffff;
            --muted: #8a8a8a;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

        /* Password Modal */
        .password-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center;
            align-items: center; z-index: 1000;
        }
        .password-box {
            background: var(--card); padding: 40px; border-radius: var(--radius);
            width: 90%; max-width: 450px; border: 1px solid var(--primary);
            text-align: center;
        }
        .password-box input, .password-box button {
            width: 100%; padding: 14px; margin-bottom: 15px;
            border-radius: var(--radius); font-size: 16px;
        }
        .password-box input {
            background: rgba(255, 255, 255, 0.05); color: var(--text);
            border: 1px solid var(--muted); outline: none;
        }
        .password-box button {
            background: linear-gradient(135deg, var(--primary), var(--dark));
            color: white; border: none; cursor: pointer; font-weight: 600;
        }
        .error { color: var(--danger); margin-top: 10px; display: none; }

        .dashboard { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-box {
            background: linear-gradient(145deg, var(--card), #151515);
            padding: 20px; border-radius: var(--radius); min-width: 140px;
            text-align: center;
        }
        .btn {
            padding: 10px 20px; border: none; border-radius: 6px;
            cursor: pointer; display: inline-flex; align-items: center;
            gap: 8px; font-size: 14px; font-weight: 600; transition: all 0.3s;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--dark)); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #c0392b); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #27ae60); color: white; }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #e67e22); color: white; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        .table-container {
            background: linear-gradient(145deg, var(--card), #151515);
            border-radius: var(--radius); padding: 25px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 18px 15px; text-align: left; color: var(--primary); }
        td { padding: 16px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); vertical-align: middle; }
        tbody tr:hover { background: rgba(52, 152, 219, 0.05); }

        .avatar-circle {
            width: 45px; height: 45px; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--primary);
            background: #2c3e50;
        }
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .badge-active { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .badge-blocked { background: rgba(231, 76, 60, 0.2); color: var(--danger); }

        .actions-dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            background: none; border: none; color: var(--muted); cursor: pointer;
            font-size: 18px; padding: 5px 10px;
        }
        .dropdown-content {
            display: none; position: absolute; right: 0; background: var(--card);
            min-width: 150px; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 10; border: 1px solid rgba(255,255,255,0.1);
        }
        .dropdown-content button {
            width: 100%; text-align: left; background: none; border: none;
            padding: 10px 15px; color: var(--text); cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }
        .dropdown-content button:hover { background: rgba(52,152,219,0.2); }
        .actions-dropdown:hover .dropdown-content { display: block; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1001; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: linear-gradient(145deg, var(--card), #151515);
            padding: 25px; border-radius: var(--radius);
            width: 100%; max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--primary);
            margin: auto;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--muted); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05);
            color: var(--text); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }
        .avatar-upload {
            border: 2px dashed rgba(255,255,255,0.2);
            padding: 15px; text-align: center; cursor: pointer; border-radius: 8px;
            margin-top: 10px;
        }
        .avatar-upload:hover { border-color: var(--primary); background: rgba(52,152,219,0.05); }
        .avatar-preview {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            margin: 10px auto; display: block; border: 2px solid var(--primary);
        }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .status { padding: 15px; border-radius: var(--radius); text-align: center; display: none; margin-bottom: 20px; }
        .status-success { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .status-error { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
        .loading { text-align: center; padding: 60px; }
        .fa-spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .password-row {
            display: flex; gap: 10px; align-items: center;
        }
        .password-row input {
            flex: 1;
        }
        .toggle-pwd {
            background: none; border: none; color: var(--muted); cursor: pointer;
            padding: 0 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h2><i class="fas fa-lock"></i> Admin Access</h2>
            <input type="password" id="passwordInput" placeholder="Enter admin password">
            <button id="submitPassword"><i class="fas fa-unlock"></i> Access Dashboard</button>
            <div class="error" id="errorMessage">❌ Incorrect password</div>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div class="modal" id="addAccountModal">
        <div class="modal-content">
            <h3><i class="fas fa-user-plus"></i> Add New Account</h3>
            <div class="form-group"><label>Name</label><input type="text" id="addName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="addEmail"></div>
            <div class="form-group"><label>Password</label><input type="text" id="addPassword"></div>
            <div class="form-group">
                <label>Avatar (optional)</label>
                <div class="avatar-upload" id="addAvatarUpload">
                    <i class="fas fa-cloud-upload-alt"></i> Click to upload image
                    <input type="file" id="addAvatarInput" accept="image/*" style="display:none">
                </div>
                <img id="addAvatarPreview" class="avatar-preview" style="display:none">
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="closeAddModal">Cancel</button>
                <button class="btn btn-success" id="confirmAddAccount">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Edit Account Modal -->
    <div class="modal" id="editAccountModal">
        <div class="modal-content">
            <h3><i class="fas fa-user-edit"></i> Edit Account</h3>
            <div class="form-group"><label>ID</label><input type="text" id="editId" readonly></div>
            <div class="form-group"><label>Name</label><input type="text" id="editName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="form-group">
                <label>Current Password</label>
                <div class="password-row">
                    <input type="password" id="editCurrentPassword" readonly disabled>
                    <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('editCurrentPassword')"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="editNewPassword" placeholder="Leave empty to keep current">
            </div>
            <div class="form-group">
                <label>Avatar</label>
                <div class="avatar-upload" id="editAvatarUpload">
                    <i class="fas fa-cloud-upload-alt"></i> Click to upload new image
                    <input type="file" id="editAvatarInput" accept="image/*" style="display:none">
                </div>
                <img id="editAvatarPreview" class="avatar-preview">
            </div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="closeEditModal">Cancel</button>
                <button class="btn btn-success" id="saveEditAccount">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Financial Modal -->
    <div class="modal" id="financialModal">
        <div class="modal-content">
            <h3><i class="fas fa-wallet"></i> Financial Details</h3>
            <div id="financialInfo"></div>
            <div class="form-group"><label>Update Balance ($)</label><input type="number" id="updateBalanceAmount" step="0.01"></div>
            <div class="form-group"><label>Action</label><select id="balanceAction"><option value="add">Add to Balance</option><option value="set">Set New Balance</option></select></div>
            <div class="form-group"><label>Card Code</label><input type="text" id="updateCardCode"></div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="closeFinancialModal">Close</button>
                <button class="btn btn-success" id="saveFinancialChanges">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <div class="header-left"><h1><i class="fas fa-users-cog"></i> B.Y PRO Admin Panel</h1></div>
            <div class="stats">
                <div class="stat-box"><h3>Total Accounts</h3><p id="totalAccounts">0</p></div>
                <div class="stat-box"><h3>Total Balance</h3><p id="totalBalance">$0</p></div>
                <div class="stat-box"><h3>Blocked</h3><p id="blockedCount">0</p></div>
                <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <button class="btn btn-success" id="addAccountBtn" style="margin-bottom: 20px;"><i class="fas fa-plus"></i> Add New Account</button>
        <div id="statusMessage" class="status"></div>

        <div class="table-container">
             <table>
                <thead>
                    <tr><th>Avatar</th><th>ID</th><th>Name</th><th>Email</th><th>Balance</th><th>Card Code</th><th>Status</th><th>Actions</th> </tr>
                </thead>
                <tbody id="accountsTableBody"> <tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr> </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = 'https://b-y-pro-acounts-login.onrender.com/api';
        const INTERNAL_KEY = 'bypro-internal-key-2025';
        const ADMIN_PASSWORD = '20070909';

        let accountsData = [];
        let currentEditId = null;
        let currentFinancialId = null;
        let addAvatarFile = null;
        let editAvatarFile = null;

        function showStatus(msg, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `status status-${type}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        async function callAPI(endpoint, method = 'GET', data = null, isFormData = false) {
            const options = { method, headers: {} };
            if (!isFormData) options.headers['Content-Type'] = 'application/json';
            options.headers['x-api-key'] = INTERNAL_KEY;
            if (data) options.body = isFormData ? data : JSON.stringify(data);
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error || `HTTP ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`API call failed: ${endpoint}`, error);
                throw error;
            }
        }

        async function fetchFinancial(userId) {
            try {
                const result = await callAPI(`/financial/${userId}`);
                if (result.success) return result.data;
            } catch (e) {}
            return { balance: 0, cardCode: 'Not set', transactions: [] };
        }

        async function uploadAvatar(accountId, file) {
            const formData = new FormData();
            formData.append('avatar', file);
            try {
                const response = await fetch(`${API_BASE}/accounts/${accountId}/avatar`, {
                    method: 'POST',
                    headers: { 'x-api-key': INTERNAL_KEY },
                    body: formData
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error);
                return data.avatarUrl;
            } catch (error) {
                console.error('Avatar upload error:', error);
                showStatus('Failed to upload avatar: ' + error.message, 'error');
                throw error;
            }
        }

        async function loadAccounts() {
            const tbody = document.getElementById('accountsTableBody');
            tbody.innerHTML = '<tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';
            try {
                const result = await callAPI('/get-all-accounts');
                let accounts = result.accounts || [];
                let totalBalance = 0, blockedCount = 0;
                for (const acc of accounts) {
                    const financial = await fetchFinancial(acc.id);
                    acc.balance = financial?.balance || 0;
                    acc.cardCode = financial?.cardCode || 'Not set';
                    totalBalance += acc.balance;
                    if (acc.blocked) blockedCount++;
                }
                accountsData = accounts;
                document.getElementById('totalAccounts').textContent = accounts.length;
                document.getElementById('totalBalance').textContent = `$${totalBalance.toFixed(2)}`;
                document.getElementById('blockedCount').textContent = blockedCount;

                tbody.innerHTML = accounts.map(acc => `
                    <tr>
                        <td><img class="avatar-circle" src="${acc.avatar || 'https://i.ibb.co/SDxkt40s/user.png'}" onerror="this.src='https://i.ibb.co/SDxkt40s/user.png'"></td>
                        <td><strong>${acc.id}</strong></td>
                        <td>${acc.name || 'No Name'}</td>
                        <td>${acc.email || 'No Email'}</td>
                        <td style="color: var(--success);">$${(acc.balance || 0).toFixed(2)}</td>
                        <td><code style="font-size: 11px;">${acc.cardCode}</code></td>
                        <td><span class="badge ${acc.blocked ? 'badge-blocked' : 'badge-active'}">${acc.blocked ? 'BLOCKED' : 'ACTIVE'}</span></td>
                        <td>
                            <div class="actions-dropdown">
                                <button class="dropdown-btn"><i class="fas fa-ellipsis-v"></i></button>
                                <div class="dropdown-content">
                                    <button onclick="openEditAccount('${acc.id}')"><i class="fas fa-edit"></i> Edit</button>
                                    <button onclick="openFinancialModal('${acc.id}')"><i class="fas fa-wallet"></i> Finance</button>
                                    <button onclick="toggleBlock('${acc.id}', ${!acc.blocked})"><i class="fas ${acc.blocked ? 'fa-unlock' : 'fa-ban'}"></i> ${acc.blocked ? 'Unblock' : 'Block'}</button>
                                    <button onclick="deleteAccount('${acc.id}')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="8" class="loading"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</td></tr>`;
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function openEditAccount(id) {
            const account = accountsData.find(a => a.id === id);
            if (!account) return;
            currentEditId = id;
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = account.name || '';
            document.getElementById('editEmail').value = account.email || '';
            // We need to get current password from server – it's not in accountsData for security. We can fetch full account details.
            try {
                const fullAccount = await callAPI(`/accounts/${id}`);
                if (fullAccount.success && fullAccount.account) {
                    document.getElementById('editCurrentPassword').value = fullAccount.account.password || '******';
                } else {
                    document.getElementById('editCurrentPassword').value = 'Not available';
                }
            } catch (e) {
                document.getElementById('editCurrentPassword').value = 'Error loading';
            }
            document.getElementById('editNewPassword').value = '';
            document.getElementById('editAvatarPreview').src = account.avatar || 'https://i.ibb.co/SDxkt40s/user.png';
            editAvatarFile = null;
            document.getElementById('editAccountModal').style.display = 'flex';
        }

        async function saveEditAccount() {
            const id = currentEditId;
            const name = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const newPassword = document.getElementById('editNewPassword').value.trim();
            if (!name || !email) { showStatus('Name and email required', 'error'); return; }
            const payload = { name, email };
            if (newPassword) payload.password = newPassword;
            try {
                await callAPI(`/accounts/${id}`, 'PUT', payload);
                if (editAvatarFile) {
                    await uploadAvatar(id, editAvatarFile);
                }
                showStatus(`Account ${id} updated`, 'success');
                document.getElementById('editAccountModal').style.display = 'none';
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function deleteAccount(id) {
            if (!confirm(`⚠️ Permanently delete account ${id}?`)) return;
            try {
                await callAPI(`/accounts/${id}`, 'DELETE');
                showStatus(`Account ${id} deleted`, 'success');
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function toggleBlock(userId, block) {
            try {
                await callAPI(`/accounts/${userId}/block`, 'POST', { blocked: block });
                showStatus(`Account ${userId} ${block ? 'BLOCKED' : 'UNBLOCKED'}`, 'success');
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function openFinancialModal(userId) {
            currentFinancialId = userId;
            const financial = await fetchFinancial(userId);
            document.getElementById('financialInfo').innerHTML = `
                <div class="info-row"><span>💰 Balance</span><span style="color: var(--success);">$${(financial?.balance || 0).toFixed(2)}</span></div>
                <div class="info-row"><span>💳 Card Code</span><span><code>${financial?.cardCode || 'Not set'}</code></span></div>
                <div class="info-row"><span>📅 Last Transaction</span><span>${financial?.transactions?.[0]?.description || 'None'}</span></div>
            `;
            document.getElementById('updateBalanceAmount').value = '';
            document.getElementById('updateCardCode').value = financial?.cardCode || '';
            document.getElementById('financialModal').style.display = 'flex';
        }

        async function saveFinancialChanges() {
            const userId = currentFinancialId;
            const amountInput = document.getElementById('updateBalanceAmount').value;
            const action = document.getElementById('balanceAction').value;
            const newCardCode = document.getElementById('updateCardCode').value;
            try {
                const current = await fetchFinancial(userId);
                let updated = false;
                if (amountInput) {
                    const amount = parseFloat(amountInput);
                    if (!isNaN(amount)) {
                        let newBalance = action === 'set' ? amount : current.balance + amount;
                        await callAPI('/financial/add-balance', 'POST', { userId, amount: newBalance - current.balance, description: `Admin ${action} balance` });
                        updated = true;
                    }
                }
                if (newCardCode && newCardCode !== current.cardCode) {
                    await callAPI('/financial/update-card', 'POST', { userId, cardCode: newCardCode });
                    updated = true;
                }
                if (updated) showStatus('Financial data updated', 'success');
                document.getElementById('financialModal').style.display = 'none';
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function addAccount() {
            const name = document.getElementById('addName').value.trim();
            const email = document.getElementById('addEmail').value.trim();
            const password = document.getElementById('addPassword').value.trim();
            if (!name || !email || !password) { showStatus('All fields required', 'error'); return; }
            try {
                const nextId = await callAPI('/next-id');
                const newId = nextId.nextId || String(Date.now());
                await callAPI('/create-account', 'POST', {
                    id: newId, name, email, password, otpCode: '123456'
                });
                if (addAvatarFile) {
                    await uploadAvatar(newId, addAvatarFile);
                }
                showStatus(`Account ${newId} created!`, 'success');
                document.getElementById('addAccountModal').style.display = 'none';
                document.getElementById('addName').value = '';
                document.getElementById('addEmail').value = '';
                document.getElementById('addPassword').value = '';
                addAvatarFile = null;
                document.getElementById('addAvatarPreview').style.display = 'none';
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        function handleAddAvatar(file) {
            if (!file) return;
            addAvatarFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                const preview = document.getElementById('addAvatarPreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
        function handleEditAvatar(file) {
            if (!file) return;
            editAvatarFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('editAvatarPreview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        }

        document.getElementById('submitPassword').onclick = () => {
            if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAccounts();
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        };
        document.getElementById('passwordInput').onkeypress = e => e.key === 'Enter' && document.getElementById('submitPassword').click();

        document.getElementById('refreshBtn').onclick = loadAccounts;
        document.getElementById('addAccountBtn').onclick = () => {
            document.getElementById('addAccountModal').style.display = 'flex';
        };
        document.getElementById('closeAddModal').onclick = () => document.getElementById('addAccountModal').style.display = 'none';
        document.getElementById('confirmAddAccount').onclick = addAccount;
        document.getElementById('closeEditModal').onclick = () => document.getElementById('editAccountModal').style.display = 'none';
        document.getElementById('saveEditAccount').onclick = saveEditAccount;
        document.getElementById('closeFinancialModal').onclick = () => document.getElementById('financialModal').style.display = 'none';
        document.getElementById('saveFinancialChanges').onclick = saveFinancialChanges;

        document.getElementById('addAvatarUpload').onclick = () => document.getElementById('addAvatarInput').click();
        document.getElementById('addAvatarInput').onchange = e => handleAddAvatar(e.target.files[0]);
        document.getElementById('editAvatarUpload').onclick = () => document.getElementById('editAvatarInput').click();
        document.getElementById('editAvatarInput').onchange = e => handleEditAvatar(e.target.files[0]);

        window.openEditAccount = openEditAccount;
        window.openFinancialModal = openFinancialModal;
        window.toggleBlock = toggleBlock;
        window.deleteAccount = deleteAccount;
        window.togglePasswordVisibility = togglePasswordVisibility;
    </script>
</body>
</html>
