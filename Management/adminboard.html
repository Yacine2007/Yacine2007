<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Y PRO - Admin Dashboard (Full Integration)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --dark: #2980b9;
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --text: #ffffff;
            --muted: #8a8a8a;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

        /* Password Modal */
        .password-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center;
            align-items: center; z-index: 1000;
        }
        .password-box {
            background: var(--card); padding: 40px; border-radius: var(--radius);
            width: 90%; max-width: 450px; border: 1px solid var(--primary);
            text-align: center;
        }
        .password-box input, .password-box button {
            width: 100%; padding: 14px; margin-bottom: 15px;
            border-radius: var(--radius); font-size: 16px;
        }
        .password-box input {
            background: rgba(255, 255, 255, 0.05); color: var(--text);
            border: 1px solid var(--muted); outline: none;
        }
        .password-box button {
            background: linear-gradient(135deg, var(--primary), var(--dark));
            color: white; border: none; cursor: pointer; font-weight: 600;
        }
        .error { color: var(--danger); margin-top: 10px; display: none; }

        /* Dashboard */
        .dashboard { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat-box {
            background: linear-gradient(145deg, var(--card), #151515);
            padding: 20px; border-radius: var(--radius); min-width: 140px;
            text-align: center;
        }
        .btn {
            padding: 10px 20px; border: none; border-radius: 6px;
            cursor: pointer; display: inline-flex; align-items: center;
            gap: 8px; font-size: 14px; font-weight: 600; transition: all 0.3s;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--dark)); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #c0392b); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #27ae60); color: white; }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #e67e22); color: white; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        .table-container {
            background: linear-gradient(145deg, var(--card), #151515);
            border-radius: var(--radius); padding: 25px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 18px 15px; text-align: left; color: var(--primary); }
        td { padding: 16px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        tbody tr:hover { background: rgba(52, 152, 219, 0.05); }

        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .badge-active { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .badge-blocked { background: rgba(231, 76, 60, 0.2); color: var(--danger); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1001; justify-content: center; align-items: center;
        }
        .modal-content {
            background: linear-gradient(145deg, var(--card), #151515);
            padding: 35px; border-radius: var(--radius);
            width: 90%; max-width: 550px;
            border: 1px solid var(--primary);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--muted); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05);
            color: var(--text); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .status { padding: 15px; border-radius: var(--radius); text-align: center; display: none; margin-bottom: 20px; }
        .status-success { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .status-error { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
        .status-warning { background: rgba(243, 156, 18, 0.2); color: var(--warning); }
        .loading { text-align: center; padding: 60px; }
        .fa-spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h2><i class="fas fa-lock"></i> Admin Access</h2>
            <input type="password" id="passwordInput" placeholder="Enter admin password">
            <button id="submitPassword"><i class="fas fa-unlock"></i> Access Dashboard</button>
            <div class="error" id="errorMessage">❌ Incorrect password</div>
        </div>
    </div>

    <!-- Edit Account Modal -->
    <div class="modal" id="editAccountModal">
        <div class="modal-content">
            <h3><i class="fas fa-user-edit"></i> Edit Account</h3>
            <div class="form-group"><label>ID</label><input type="text" id="editId" readonly></div>
            <div class="form-group"><label>Name</label><input type="text" id="editName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="form-group"><label>New Password</label><input type="text" id="editPassword" placeholder="Leave empty to keep current"></div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="closeEditModal">Cancel</button>
                <button class="btn btn-success" id="saveEditAccount">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Financial Modal -->
    <div class="modal" id="financialModal">
        <div class="modal-content">
            <h3><i class="fas fa-wallet"></i> Financial Details</h3>
            <div id="financialInfo"></div>
            <div class="form-group"><label>Update Balance ($)</label><input type="number" id="updateBalanceAmount" step="0.01" placeholder="Enter amount"></div>
            <div class="form-group"><label>Action</label><select id="balanceAction"><option value="add">Add to Balance</option><option value="set">Set New Balance</option></select></div>
            <div class="form-group"><label>Card Code</label><input type="text" id="updateCardCode" placeholder="byppcn-xxxxxxxxxxxxxxx"></div>
            <div class="modal-actions">
                <button class="btn btn-danger" id="closeFinancialModal">Close</button>
                <button class="btn btn-success" id="saveFinancialChanges">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <div class="header-left"><h1><i class="fas fa-users-cog"></i> B.Y PRO Admin Panel</h1></div>
            <div class="stats">
                <div class="stat-box"><h3>Total Accounts</h3><p id="totalAccounts">0</p></div>
                <div class="stat-box"><h3>Total Balance</h3><p id="totalBalance">$0</p></div>
                <div class="stat-box"><h3>Blocked</h3><p id="blockedCount">0</p></div>
                <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <button class="btn btn-success" id="addAccountBtn" style="margin-bottom: 20px;"><i class="fas fa-plus"></i> Add New Account</button>

        <div id="statusMessage" class="status"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Balance</th><th>Card Code</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="accountsTableBody"><tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_BASE = 'https://b-y-pro-acounts-login.onrender.com/api';
        const INTERNAL_KEY = 'bypro-internal-key-2025';
        const ADMIN_PASSWORD = '20070909';

        let accountsData = [];
        let currentEditId = null;
        let currentFinancialId = null;

        function showStatus(msg, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `status status-${type}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        async function callAPI(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': INTERNAL_KEY
                }
            };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.error || `HTTP ${response.status}`);
            }
            return await response.json();
        }

        async function fetchFinancial(userId) {
            try {
                const result = await callAPI(`/financial/${userId}`);
                if (result.success) return result.data;
            } catch (e) {}
            return { balance: 0, cardCode: 'Not set', transactions: [] };
        }

        async function updateFinancial(userId, updates) {
            if (updates.balance !== undefined) {
                const current = await fetchFinancial(userId);
                await callAPI('/financial/add-balance', 'POST', {
                    userId,
                    amount: updates.balance - current.balance,
                    description: 'Admin update'
                });
            }
            if (updates.cardCode) {
                await callAPI('/financial/update-card', 'POST', { userId, cardCode: updates.cardCode });
            }
        }

        async function loadAccounts() {
            const tbody = document.getElementById('accountsTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';
            try {
                const result = await callAPI('/get-all-accounts');
                let accounts = result.accounts || [];
                let totalBalance = 0;
                let blockedCount = 0;
                for (const acc of accounts) {
                    const financial = await fetchFinancial(acc.id);
                    acc.balance = financial?.balance || 0;
                    acc.cardCode = financial?.cardCode || 'Not set';
                    totalBalance += acc.balance;
                    if (acc.blocked) blockedCount++;
                }
                accountsData = accounts;
                document.getElementById('totalAccounts').textContent = accounts.length;
                document.getElementById('totalBalance').textContent = `$${totalBalance.toFixed(2)}`;
                document.getElementById('blockedCount').textContent = blockedCount;

                tbody.innerHTML = accounts.map(acc => `
                    <tr>
                        <td><strong>${acc.id}</strong></td>
                        <td>${acc.name || 'No Name'}</td>
                        <td>${acc.email || 'No Email'}</td>
                        <td style="color: var(--success);">$${(acc.balance || 0).toFixed(2)}</td>
                        <td><code style="font-size: 11px;">${acc.cardCode}</code></td>
                        <td><span class="badge ${acc.blocked ? 'badge-blocked' : 'badge-active'}">${acc.blocked ? 'BLOCKED' : 'ACTIVE'}</span></td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="openEditAccount('${acc.id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn btn-warning btn-sm" onclick="openFinancialModal('${acc.id}')"><i class="fas fa-wallet"></i> Finance</button>
                            <button class="btn btn-danger btn-sm" onclick="toggleBlock('${acc.id}', ${!acc.blocked})"><i class="fas ${acc.blocked ? 'fa-unlock' : 'fa-ban'}"></i> ${acc.blocked ? 'Unblock' : 'Block'}</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteAccount('${acc.id}')"><i class="fas fa-trash"></i> Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</td></tr>`;
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // ==================== ACCOUNT MANAGEMENT ====================
        async function openEditAccount(id) {
            const account = accountsData.find(a => a.id === id);
            if (!account) return;
            currentEditId = id;
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = account.name || '';
            document.getElementById('editEmail').value = account.email || '';
            document.getElementById('editPassword').value = '';
            document.getElementById('editAccountModal').style.display = 'flex';
        }

        async function saveEditAccount() {
            const id = currentEditId;
            const name = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const password = document.getElementById('editPassword').value.trim();
            if (!name || !email) {
                showStatus('Name and email are required', 'error');
                return;
            }
            const payload = { name, email };
            if (password) payload.password = password;
            try {
                await callAPI(`/accounts/${id}`, 'PUT', payload);
                showStatus(`Account ${id} updated successfully`, 'success');
                document.getElementById('editAccountModal').style.display = 'none';
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function deleteAccount(id) {
            if (!confirm(`⚠️ Permanently delete account ${id}?\nThis action cannot be undone!`)) return;
            try {
                await callAPI(`/accounts/${id}`, 'DELETE');
                showStatus(`Account ${id} deleted`, 'success');
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function toggleBlock(userId, block) {
            try {
                await callAPI(`/accounts/${userId}/block`, 'POST', { blocked: block });
                showStatus(`Account ${userId} ${block ? 'BLOCKED' : 'UNBLOCKED'}`, 'success');
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // ==================== FINANCIAL MANAGEMENT ====================
        async function openFinancialModal(userId) {
            currentFinancialId = userId;
            const financial = await fetchFinancial(userId);
            document.getElementById('financialInfo').innerHTML = `
                <div class="info-row"><span>💰 Balance</span><span style="color: var(--success);">$${(financial?.balance || 0).toFixed(2)}</span></div>
                <div class="info-row"><span>💳 Card Code</span><span><code>${financial?.cardCode || 'Not set'}</code></span></div>
                <div class="info-row"><span>📅 Last Transaction</span><span>${financial?.transactions?.[0]?.description || 'None'}</span></div>
            `;
            document.getElementById('updateBalanceAmount').value = '';
            document.getElementById('updateCardCode').value = financial?.cardCode || '';
            document.getElementById('financialModal').style.display = 'flex';
        }

        async function saveFinancialChanges() {
            const userId = currentFinancialId;
            const amountInput = document.getElementById('updateBalanceAmount').value;
            const action = document.getElementById('balanceAction').value;
            const newCardCode = document.getElementById('updateCardCode').value;
            try {
                const current = await fetchFinancial(userId);
                let updated = false;
                if (amountInput) {
                    const amount = parseFloat(amountInput);
                    if (!isNaN(amount)) {
                        let newBalance = action === 'set' ? amount : current.balance + amount;
                        await callAPI('/financial/add-balance', 'POST', {
                            userId,
                            amount: newBalance - current.balance,
                            description: `Admin ${action} balance`
                        });
                        updated = true;
                    }
                }
                if (newCardCode && newCardCode !== current.cardCode) {
                    await callAPI('/financial/update-card', 'POST', { userId, cardCode: newCardCode });
                    updated = true;
                }
                if (updated) showStatus('Financial data updated', 'success');
                document.getElementById('financialModal').style.display = 'none';
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // ==================== ADD ACCOUNT ====================
        async function addAccount() {
            const name = prompt('Enter full name:');
            if (!name) return;
            const email = prompt('Enter email:');
            if (!email) return;
            const password = prompt('Enter password:');
            if (!password) return;
            try {
                const nextId = await callAPI('/next-id');
                const newId = nextId.nextId || String(Date.now());
                await callAPI('/create-account', 'POST', {
                    id: newId,
                    name,
                    email,
                    password,
                    otpCode: '123456'
                });
                showStatus(`Account ${newId} created!`, 'success');
                loadAccounts();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // ==================== AUTHENTICATION ====================
        document.getElementById('submitPassword').onclick = () => {
            if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAccounts();
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        };
        document.getElementById('passwordInput').onkeypress = e => e.key === 'Enter' && document.getElementById('submitPassword').click();

        // Event Listeners
        document.getElementById('refreshBtn').onclick = loadAccounts;
        document.getElementById('addAccountBtn').onclick = addAccount;
        document.getElementById('closeEditModal').onclick = () => document.getElementById('editAccountModal').style.display = 'none';
        document.getElementById('saveEditAccount').onclick = saveEditAccount;
        document.getElementById('closeFinancialModal').onclick = () => document.getElementById('financialModal').style.display = 'none';
        document.getElementById('saveFinancialChanges').onclick = saveFinancialChanges;

        window.openEditAccount = openEditAccount;
        window.openFinancialModal = openFinancialModal;
        window.toggleBlock = toggleBlock;
        window.deleteAccount = deleteAccount;
    </script>
</body>
</html>
