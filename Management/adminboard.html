<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>B.Y PRO Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #0a0a0a; min-height: 100vh; padding: 24px; }
        
        /* Password Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px); }
        .password-box { background: #1a1a1a; padding: 32px; border-radius: 28px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #2a6df4; }
        .password-box h2 { color: #2a6df4; margin-bottom: 8px; }
        .password-box p { color: #888; margin-bottom: 24px; font-size: 14px; }
        .password-box input { width: 100%; padding: 14px; background: #2a2a2a; border: 1px solid #444; border-radius: 40px; color: white; font-size: 16px; margin-bottom: 16px; outline: none; }
        .password-box input:focus { border-color: #2a6df4; }
        .password-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #2a6df4, #1a5be0); border: none; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .password-box button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(42,109,244,0.3); }
        .error-msg { color: #e74c3c; margin-top: 12px; display: none; font-size: 14px; }
        
        /* Dashboard */
        .dashboard { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .header h1 { font-size: 20px; font-weight: 500; color: white; }
        .header h1 i { color: #2a6df4; margin-right: 8px; }
        .stats { display: flex; gap: 12px; }
        .stat-card { background: #1a1a1a; padding: 12px 20px; border-radius: 20px; text-align: center; border: 1px solid #2a2a2a; }
        .stat-card h3 { font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card p { font-size: 20px; font-weight: 600; color: white; }
        .refresh-btn { background: #2a2a2a; border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: 0.2s; }
        .refresh-btn:hover { background: #2a6df4; }
        
        .add-btn { background: linear-gradient(135deg, #2a6df4, #1a5be0); border: none; padding: 12px 24px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; transition: 0.2s; }
        .add-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(42,109,244,0.3); }
        
        .table-container { background: #1a1a1a; border-radius: 24px; padding: 20px; overflow-x: auto; border: 1px solid #2a2a2a; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px 12px; color: #888; font-weight: 500; font-size: 13px; border-bottom: 1px solid #2a2a2a; }
        td { padding: 14px 12px; border-bottom: 1px solid #2a2a2a; vertical-align: middle; }
        tr:hover { background: #222; }
        
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #2a6df4; background: #2c3e50; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 30px; font-size: 11px; font-weight: 600; }
        .badge-active { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .badge-blocked { background: rgba(231,76,60,0.2); color: #e74c3c; }
        
        /* Dropdown Menu (3 dots) */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; padding: 8px; border-radius: 8px; transition: 0.2s; }
        .dropdown-btn:hover { background: #2a2a2a; color: white; }
        .dropdown-menu { position: absolute; right: 0; top: 100%; background: #2a2a2a; border-radius: 16px; min-width: 160px; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: none; overflow: hidden; border: 1px solid #3a3a3a; }
        .dropdown-menu button { width: 100%; padding: 12px 16px; text-align: left; background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; transition: 0.2s; }
        .dropdown-menu button:hover { background: #3a3a3a; }
        .dropdown-menu button i { width: 20px; color: #2a6df4; }
        .dropdown.show .dropdown-menu { display: block; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 1100; backdrop-filter: blur(4px); }
        .modal-content { background: #1a1a1a; border-radius: 32px; padding: 28px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; border: 1px solid #2a6df4; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h3 { color: white; font-size: 20px; }
        .modal-header h3 i { color: #2a6df4; margin-right: 8px; }
        .close-modal { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #888; font-size: 13px; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 40px; color: white; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #2a6df4; }
        .avatar-upload { border: 2px dashed #3a3a3a; border-radius: 20px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .avatar-upload:hover { border-color: #2a6df4; background: #222; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 12px auto; display: none; border: 2px solid #2a6df4; }
        .btn-primary { background: linear-gradient(135deg, #2a6df4, #1a5be0); border: none; padding: 12px 24px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: #2a2a2a; border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; transition: 0.2s; }
        .btn-secondary:hover { background: #3a3a3a; }
        .flex-buttons { display: flex; gap: 12px; margin-top: 20px; }
        
        /* Loading Spinner */
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1200; backdrop-filter: blur(4px); }
        .spinner { width: 50px; height: 50px; border: 3px solid #2a2a2a; border-top-color: #2a6df4; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2a6df4; color: white; padding: 12px 24px; border-radius: 40px; font-size: 14px; z-index: 1300; display: none; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        .status-msg { background: rgba(46,204,113,0.2); color: #2ecc71; padding: 12px; border-radius: 20px; text-align: center; margin-bottom: 20px; display: none; }
        .status-error { background: rgba(231,76,60,0.2); color: #e74c3c; }
    </style>
</head>
<body>
    <!-- Password Modal -->
    <div id="passwordModal" class="modal-overlay">
        <div class="password-box">
            <h2><i class="fas fa-lock"></i> Admin Access</h2>
            <p>Enter admin password to access the system</p>
            <input type="password" id="passwordInput" placeholder="Password">
            <button id="submitPassword">Access Dashboard</button>
            <div id="errorMessage" class="error-msg">Incorrect password</div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="header">
            <h1><i class="fas fa-users-cog"></i> B.Y PRO Account Management</h1>
            <div class="stats">
                <div class="stat-card"><h3>Total</h3><p id="totalAccounts">0</p></div>
                <div class="stat-card"><h3>Balance</h3><p id="totalBalance">$0</p></div>
                <div class="stat-card"><h3>Blocked</h3><p id="blockedCount">0</p></div>
                <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <button class="add-btn" id="addAccountBtn"><i class="fas fa-plus"></i> Add New Account</button>
        <div id="statusMessage" class="status-msg"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Avatar</th><th>ID</th><th>Name</th><th>Email</th><th>Balance</th><th>Card</th><th>Status</th><th></th></tr>
                </thead>
                <tbody id="accountsTableBody"><tr><td colspan="8" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3><i class="fas fa-user-plus"></i> Add Account</h3><button class="close-modal" onclick="closeModal('addModal')">&times;</button></div>
            <div class="form-group"><label>Name</label><input type="text" id="addName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="addEmail"></div>
            <div class="form-group"><label>Password</label><input type="text" id="addPassword"></div>
            <div class="form-group">
                <label>Avatar (optional)</label>
                <div class="avatar-upload" id="addAvatarUpload"><i class="fas fa-cloud-upload-alt"></i> Click to upload</div>
                <input type="file" id="addAvatarInput" accept="image/*" style="display:none">
                <img id="addAvatarPreview" class="avatar-preview">
            </div>
            <div class="flex-buttons"><button class="btn-secondary" onclick="closeModal('addModal')">Cancel</button><button class="btn-primary" id="confirmAdd">Create Account</button></div>
        </div>
    </div>

    <!-- Edit Account Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3><i class="fas fa-edit"></i> Edit Account</h3><button class="close-modal" onclick="closeModal('editModal')">&times;</button></div>
            <div class="form-group"><label>ID</label><input type="text" id="editId" readonly></div>
            <div class="form-group"><label>Name</label><input type="text" id="editName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="form-group"><label>New Password</label><input type="text" id="editPassword" placeholder="Leave empty to keep current"></div>
            <div class="form-group">
                <label>Avatar</label>
                <div class="avatar-upload" id="editAvatarUpload"><i class="fas fa-cloud-upload-alt"></i> Change image</div>
                <input type="file" id="editAvatarInput" accept="image/*" style="display:none">
                <img id="editAvatarPreview" class="avatar-preview">
            </div>
            <div class="flex-buttons"><button class="btn-secondary" onclick="closeModal('editModal')">Cancel</button><button class="btn-primary" id="saveEdit">Save Changes</button></div>
        </div>
    </div>

    <!-- Financial Modal -->
    <div id="financialModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3><i class="fas fa-wallet"></i> Financial Details</h3><button class="close-modal" onclick="closeModal('financialModal')">&times;</button></div>
            <div id="financialInfo"></div>
            <div class="form-group"><label>Update Balance ($)</label><input type="number" id="updateAmount" step="0.01"></div>
            <div class="form-group"><label>Action</label><select id="balanceAction"><option value="add">Add to Balance</option><option value="set">Set New Balance</option></select></div>
            <div class="form-group"><label>Card Code</label><input type="text" id="updateCardCode"></div>
            <div class="flex-buttons"><button class="btn-secondary" onclick="closeModal('financialModal')">Cancel</button><button class="btn-primary" id="saveFinancial">Save</button></div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3><i class="fas fa-qrcode"></i> Login QR Code</h3><button class="close-modal" onclick="closeModal('qrModal')">&times;</button></div>
            <div id="qrContainer" style="text-align:center; padding:16px;"></div>
            <div class="form-group"><input type="text" id="qrData" readonly style="font-family:monospace; font-size:12px;"></div>
            <button class="btn-secondary" onclick="copyQR()"><i class="fas fa-copy"></i> Copy QR Data</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = 'https://b-y-pro-acounts-login.onrender.com/api';
        const INTERNAL_KEY = 'bypro-internal-key-2025';
        const ADMIN_PASSWORD = '20070909';

        let accountsData = [];
        let currentEditId = null;
        let currentFinancialId = null;
        let addAvatarFile = null;
        let editAvatarFile = null;

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? '#e74c3c' : '#2a6df4';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function showStatus(msg, isError = false) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = isError ? 'status-msg status-error' : 'status-msg';
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        async function callAPI(endpoint, method = 'GET', data = null, isFormData = false) {
            const options = { method, headers: {} };
            if (!isFormData) options.headers['Content-Type'] = 'application/json';
            options.headers['x-api-key'] = INTERNAL_KEY;
            if (data) options.body = isFormData ? data : JSON.stringify(data);
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (!response.ok) throw new Error((await response.json().catch(()=>({}))).error || `HTTP ${response.status}`);
            return await response.json();
        }

        async function fetchFinancial(userId) {
            try { return (await callAPI(`/financial/${userId}`)).data; } catch { return { balance: 0, cardCode: 'Not set', transactions: [] }; }
        }

        async function uploadAvatar(accountId, file) {
            const formData = new FormData();
            formData.append('avatar', file);
            const response = await fetch(`${API_BASE}/accounts/${accountId}/avatar`, {
                method: 'POST', headers: { 'x-api-key': INTERNAL_KEY }, body: formData
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.error);
            return data.avatarUrl;
        }

        async function loadAccounts() {
            showLoading(true);
            try {
                const result = await callAPI('/get-all-accounts');
                let accounts = result.accounts || [];
                let totalBalance = 0, blocked = 0;
                for (const acc of accounts) {
                    const financial = await fetchFinancial(acc.id);
                    acc.balance = financial?.balance || 0;
                    acc.cardCode = financial?.cardCode || 'Not set';
                    totalBalance += acc.balance;
                    if (acc.blocked) blocked++;
                }
                accountsData = accounts;
                document.getElementById('totalAccounts').textContent = accounts.length;
                document.getElementById('totalBalance').textContent = `$${totalBalance.toFixed(2)}`;
                document.getElementById('blockedCount').textContent = blocked;

                const tbody = document.getElementById('accountsTableBody');
                tbody.innerHTML = accounts.map(acc => `
                    <tr>
                        <td><img class="avatar" src="${acc.avatar || 'https://i.ibb.co/SDxkt40s/user.png'}" onerror="this.src='https://i.ibb.co/SDxkt40s/user.png'"></td>
                        <td><strong>${acc.id}</strong></td>
                        <td>${acc.name || 'No Name'}</td>
                        <td>${acc.email || 'No Email'}</td>
                        <td style="color:#2ecc71;">$${(acc.balance || 0).toFixed(2)}</td>
                        <td><code style="font-size:11px;">${acc.cardCode}</code></td>
                        <td><span class="badge ${acc.blocked ? 'badge-blocked' : 'badge-active'}">${acc.blocked ? 'BLOCKED' : 'ACTIVE'}</span></td>
                        <td>
                            <div class="dropdown">
                                <button class="dropdown-btn" onclick="toggleDropdown(this)"><i class="fas fa-ellipsis-v"></i></button>
                                <div class="dropdown-menu">
                                    <button onclick="openEdit('${acc.id}')"><i class="fas fa-edit"></i> Edit</button>
                                    <button onclick="openFinancial('${acc.id}')"><i class="fas fa-wallet"></i> Finance</button>
                                    <button onclick="generateQR('${acc.id}')"><i class="fas fa-qrcode"></i> QR Code</button>
                                    <button onclick="toggleBlock('${acc.id}', ${!acc.blocked})"><i class="fas ${acc.blocked ? 'fa-unlock' : 'fa-ban'}"></i> ${acc.blocked ? 'Unblock' : 'Block'}</button>
                                    <button onclick="deleteAccount('${acc.id}')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showStatus('Error: ' + error.message, true);
                document.getElementById('accountsTableBody').innerHTML = `<tr><td colspan="8" style="text-align:center; padding:40px;">Error: ${error.message}</td></tr>`;
            } finally { showLoading(false); }
        }

        function toggleDropdown(btn) {
            const dropdown = btn.closest('.dropdown');
            document.querySelectorAll('.dropdown').forEach(d => { if (d !== dropdown) d.classList.remove('show'); });
            dropdown.classList.toggle('show');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        });

        async function openEdit(id) {
            const acc = accountsData.find(a => a.id === id);
            if (!acc) return;
            currentEditId = id;
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = acc.name || '';
            document.getElementById('editEmail').value = acc.email || '';
            document.getElementById('editPassword').value = '';
            document.getElementById('editAvatarPreview').src = acc.avatar || 'https://i.ibb.co/SDxkt40s/user.png';
            document.getElementById('editAvatarPreview').style.display = 'block';
            editAvatarFile = null;
            document.getElementById('editModal').style.display = 'flex';
        }

        async function saveEdit() {
            const id = currentEditId;
            const name = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const newPassword = document.getElementById('editPassword').value.trim();
            if (!name || !email) { showStatus('Name and email required', true); return; }
            const payload = { name, email };
            if (newPassword) payload.password = newPassword;
            showLoading(true);
            try {
                await callAPI(`/accounts/${id}`, 'PUT', payload);
                if (editAvatarFile) await uploadAvatar(id, editAvatarFile);
                showStatus(`Account ${id} updated`, false);
                closeModal('editModal');
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        }

        async function deleteAccount(id) {
            if (!confirm(`⚠️ Permanently delete account ${id}?`)) return;
            showLoading(true);
            try {
                await callAPI(`/accounts/${id}`, 'DELETE');
                showStatus(`Account ${id} deleted`, false);
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        }

        async function toggleBlock(userId, block) {
            showLoading(true);
            try {
                await callAPI(`/accounts/${userId}/block`, 'POST', { blocked: block });
                showStatus(`Account ${userId} ${block ? 'BLOCKED' : 'UNBLOCKED'}`, false);
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        }

        async function openFinancial(userId) {
            currentFinancialId = userId;
            const financial = await fetchFinancial(userId);
            document.getElementById('financialInfo').innerHTML = `
                <div class="form-group"><label>💰 Balance</label><div style="color:#2ecc71;">$${(financial?.balance || 0).toFixed(2)}</div></div>
                <div class="form-group"><label>💳 Card Code</label><div><code>${financial?.cardCode || 'Not set'}</code></div></div>
                <div class="form-group"><label>📅 Last Transaction</label><div>${financial?.transactions?.[0]?.description || 'None'}</div></div>
            `;
            document.getElementById('updateAmount').value = '';
            document.getElementById('updateCardCode').value = financial?.cardCode || '';
            document.getElementById('financialModal').style.display = 'flex';
        }

        async function saveFinancial() {
            const userId = currentFinancialId;
            const amount = parseFloat(document.getElementById('updateAmount').value);
            const action = document.getElementById('balanceAction').value;
            const newCardCode = document.getElementById('updateCardCode').value;
            showLoading(true);
            try {
                const current = await fetchFinancial(userId);
                if (!isNaN(amount)) {
                    let newBalance = action === 'set' ? amount : current.balance + amount;
                    await callAPI('/financial/add-balance', 'POST', { userId, amount: newBalance - current.balance, description: `Admin ${action} balance` });
                }
                if (newCardCode && newCardCode !== current.cardCode) {
                    await callAPI('/financial/update-card', 'POST', { userId, cardCode: newCardCode });
                }
                showStatus('Financial data updated', false);
                closeModal('financialModal');
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        }

        async function generateQR(userId) {
            try {
                const account = await callAPI(`/accounts/${userId}`);
                const qrText = `BYPRO:${account.account.id}:${account.account.password}`;
                const container = document.getElementById('qrContainer');
                container.innerHTML = '';
                new QRCode(container, { text: qrText, width: 180, height: 180, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
                document.getElementById('qrData').value = qrText;
                document.getElementById('qrModal').style.display = 'flex';
            } catch (error) { showStatus('Error generating QR: ' + error.message, true); }
        }
        function copyQR() { const data = document.getElementById('qrData'); data.select(); document.execCommand('copy'); showToast('QR data copied'); }

        async function addAccount() {
            const name = document.getElementById('addName').value.trim();
            const email = document.getElementById('addEmail').value.trim();
            const password = document.getElementById('addPassword').value.trim();
            if (!name || !email || !password) { showStatus('All fields required', true); return; }
            showLoading(true);
            try {
                const result = await callAPI('/create-account', 'POST', { name, email, password });
                const newId = result.account.id;
                if (addAvatarFile) await uploadAvatar(newId, addAvatarFile);
                showStatus(`Account ${newId} created!`, false);
                closeModal('addModal');
                document.getElementById('addName').value = '';
                document.getElementById('addEmail').value = '';
                document.getElementById('addPassword').value = '';
                addAvatarFile = null;
                document.getElementById('addAvatarPreview').style.display = 'none';
                loadAccounts();
            } catch (error) { showStatus('Error: ' + error.message, true); }
            finally { showLoading(false); }
        }

        function handleAvatarUpload(inputId, previewId, fileVar) {
            const file = document.getElementById(inputId).files[0];
            if (!file) return;
            if (!file.type.match('image.*')) { showStatus('Select an image file', true); return; }
            if (file.size > 5*1024*1024) { showStatus('Max 5MB', true); return; }
            if (inputId === 'addAvatarInput') addAvatarFile = file;
            else editAvatarFile = file;
            const reader = new FileReader();
            reader.onload = e => { document.getElementById(previewId).src = e.target.result; document.getElementById(previewId).style.display = 'block'; };
            reader.readAsDataURL(file);
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Event Listeners
        document.getElementById('submitPassword').onclick = () => {
            if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAccounts();
            } else { document.getElementById('errorMessage').style.display = 'block'; }
        };
        document.getElementById('passwordInput').onkeypress = e => e.key === 'Enter' && document.getElementById('submitPassword').click();
        document.getElementById('refreshBtn').onclick = loadAccounts;
        document.getElementById('addAccountBtn').onclick = () => document.getElementById('addModal').style.display = 'flex';
        document.getElementById('confirmAdd').onclick = addAccount;
        document.getElementById('saveEdit').onclick = saveEdit;
        document.getElementById('saveFinancial').onclick = saveFinancial;
        document.getElementById('addAvatarUpload').onclick = () => document.getElementById('addAvatarInput').click();
        document.getElementById('addAvatarInput').onchange = () => handleAvatarUpload('addAvatarInput', 'addAvatarPreview', 'add');
        document.getElementById('editAvatarUpload').onclick = () => document.getElementById('editAvatarInput').click();
        document.getElementById('editAvatarInput').onchange = () => handleAvatarUpload('editAvatarInput', 'editAvatarPreview', 'edit');
    </script>
</body>
</html>
