    const techIcons = {
        'HTML5':'fab fa-html5','CSS3':'fab fa-css3-alt','JavaScript':'fab fa-js','React':'fab fa-react','Node.js':'fab fa-node-js',
        'Python':'fab fa-python','MongoDB':'fas fa-database','UI/UX Design':'fas fa-pen-ruler','Logo Design':'fas fa-palette',
        'AI Chatbots':'fas fa-brain','Chatbots IA':'fas fa-brain','بوتات ذكاء اصطناعي':'fas fa-brain','تصميم واجهات':'fas fa-pen-ruler','تصميم شعارات':'fas fa-palette'
    };

    const translations = {
        en: {
            bio: "I'm a front-end developer and UI/UX designer. I build high-performance web interfaces, e‑stores, landing pages, and dashboards. Clean code, modern design systems, seamless experiences.",
            freelance: "Freelance · Front-end specialist · Global remote · Available for contracts",
            projectsTitle: "Key Projects",
            techTitle: "Core Expertise",
            contactTitle: "Direct Contact",
            investorNote: '<i class="fas fa-graduation-cap"></i> Technical sponsor & investor — state-accredited, partnered with startups & university graduates',
            moreProjects: '<i class="fas fa-plus-circle"></i> +12 more projects available',
            expSuffix: "Years of experience"
        },
        ar: {
            bio: "أنا مطور واجهات أمامية ومصمم تجارب مستخدم. أبني واجهات ويب عالية الأداء، متاجر إلكترونية، صفحات هبوط، ولوحات تحكم. كود نظيف، أنظمة تصميم حديثة، تجارب سلسة.",
            freelance: "عمل حر · اختصاصي واجهات أمامية · عن بُعد عالمي · متاح للعقود",
            projectsTitle: "المشاريع الرئيسية",
            techTitle: "الخبرات الأساسية",
            contactTitle: "تواصل مباشر",
            investorNote: '<i class="fas fa-graduation-cap"></i> الراعي التقني والمستثمر — معتمد من الدولة، متعاقد مع مؤسسات ناشئة وخريجي الجامعات',
            moreProjects: '<i class="fas fa-plus-circle"></i> +12 مشروعاً إضافياً متاحاً',

            moreProjects: '<i class="fas fa-plus-circle"></i> +12 projets supplémentaires disponibles',
            expSuffix: "Années d'expérience"
        }
    };

    function renderProjects(lang) {
        const projects = projectsData[lang];
        const grid = document.getElementById('projectsGrid');
        grid.innerHTML = '';
        projects.forEach(proj => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.innerHTML = `
                <div class="project-category"><i class="${proj.icon}"></i> ${proj.category}</div>
                <div class="project-title">${proj.title}</div>
                <div class="project-description">${proj.desc}</div>
                <a href="${proj.link}" target="_blank" class="project-link"><i class="fas fa-arrow-right"></i> Visit Project</a>
            `;
            grid.appendChild(card);
        });
    }

    function renderTech(lang) {
        const container = document.getElementById('techStack');
        const techs = techData[lang];
        container.innerHTML = '';
        techs.forEach(tech => {
            const icon = techIcons[tech] || 'fas fa-code';
            const span = document.createElement('span');
            span.className = 'tech-item';
            span.innerHTML = `<i class="${icon}"></i> ${tech}`;
            container.appendChild(span);
        });
    }

    function setLanguage(lang) {
        renderProjects(lang);
        renderTech(lang);
        const t = translations[lang];
        document.getElementById('heroBio').innerText = t.bio;
        document.getElementById('freelanceText').innerHTML = t.freelance;
        document.getElementById('projectsTitle').innerText = t.projectsTitle;
        document.getElementById('techTitle').innerText = t.techTitle;
        document.getElementById('contactTitle').innerText = t.contactTitle;
        document.getElementById('investorNote').innerHTML = t.investorNote;
        document.getElementById('moreProjects').innerHTML = t.moreProjects;
        document.getElementById('expBadge').innerHTML = `<i class="fas fa-trophy"></i> ${expYears}+ ${t.expSuffix}`;
        document.getElementById('currentLangLabel').innerText = lang === 'en' ? 'EN' : (lang === 'ar' ? 'ع' : 'FR');
    }

    // Language dropdown logic
    const langBtn = document.getElementById('langBtn');
    const langMenu = document.getElementById('langMenu');
    langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        langMenu.classList.toggle('show');
    });
    document.addEventListener('click', () => {
        langMenu.classList.remove('show');
    });
    document.querySelectorAll('.lang-option').forEach(opt => {
        opt.addEventListener('click', (e) => {
            const lang = opt.dataset.lang;
            setLanguage(lang);
            langMenu.classList.remove('show');
        });
    });

    setLanguage('en');
</script>
</body>
</html>
