    }

        align-items: center;

        gap: 1rem;

        padding-bottom: 1rem;
        border-bottom: 1px solid #e4e9f0;
    }
    .logo {
        font-size: 1.8rem;

        letter-spacing: -0.02em;
    }
    .logo i {

        color: #1e293b;
        margin-right: 6px;
    }
    .lang-selector {

        padding: 0.5rem 1.2rem;
        border-radius: 40px;
        font-weight: 500;
        font-size: 0.85rem;
        cursor: pointer;
        font-family: inherit;

        color: #1e293b;
    }
    .lang-selector:hover {

    }

    }

    }
    .sidebar {
        flex: 1;
        min-width: 280px;
    }

        box-shadow: 0 8px 24px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.02);
        padding: 1.6rem;
        margin-bottom: 2rem;
        border: 1px solid #eef2fa;
        transition: all 0.25s ease;
    }
    .card:hover {
        box-shadow: 0 20px 35px -12px rgba(0,0,0,0.06);
        border-color: #dce5f0;
    }

    .section-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1.4rem;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #0f172a;
    }
    .section-title i {
        color: #1e293b;
        font-size: 1.3rem;
    }

    }

        background: #ffffff;
        border-radius: 24px;
        border: 1px solid #eef2fa;
        padding: 1.3rem;

        font-size: 0.7rem;

        font-weight: 600;
        padding: 0.2rem 0.7rem;
        border-radius: 40px;
        color: #1e293b;

        margin: 0.6rem 0;
        line-height: 1.45;
        flex: 1;
    }

        color: white;
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.45rem 1.2rem;

        margin-top: 0.8rem;

    }

        background: #1e293b;
        gap: 10px;

        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.92);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(6px);
    }
    .modal-content {

        max-height: 85vh;
        border-radius: 28px;
        border: 2px solid white;
    }
    .close-modal {
        position: absolute;
        top: 25px;
        right: 35px;
        font-size: 2.2rem;
        color: white;
        cursor: pointer;

    @media (max-width: 780px) {

    };
    const freelanceTexts = {
        en: "<i class='fas fa-check-circle'></i> Freelance · UI/UX specialist · Global remote",
        ar: "<i class='fas fa-check-circle'></i> عمل حر · اختصاصي واجهات · عن بُعد عالمي",
        fr: "<i class='fas fa-check-circle'></i> Freelance · spécialiste UI/UX · Remote global"
    };
    const uiText = {
        en: { projectsTitle: "Key Projects", galleryTitle: "Design Gallery", techTitle: "Core Expertise" },
        ar: { projectsTitle: "المشاريع الرئيسية", galleryTitle: "معرض التصاميم", techTitle: "الخبرات الأساسية" },
        fr: { projectsTitle: "Projets clés", galleryTitle: "Galerie Design", techTitle: "Expertises" }
    };
    const servicesList = {
        en: ["UI/UX Design", "Landing Pages", "E‑stores", "SaaS Platforms", "AI Chatbots", "Logo Design"],
        ar: ["تصميم واجهات", "صفحات هبوط", "متاجر إلكترونية", "منصات SaaS", "بوتات ذكاء", "تصميم شعارات"],
        fr: ["UI/UX Design", "Landing Pages", "Boutiques en ligne", "SaaS", "Chatbots IA", "Logo Design"]
    };
    const sampleNoteText = {
        en: "<i class='fas fa-infinity'></i> Representative sample — 12+ core projects, many more in portfolio.",
        ar: "<i class='fas fa-infinity'></i> عينة متوسطة — 12+ مشروعاً رئيسياً، والمزيد في المحفظة.",
        fr: "<i class='fas fa-infinity'></i> Échantillon représentatif — 12+ projets phares, portfolio étendu."
    };

    // gallery images (unchanged)
    const originalImages = ['1.PNG', '2.PNG', '3.PNG', 'ex.PNG', 'ex1.PNG', 'ex2.PNG', 'ex3.PNG', '258.PNG', '741.PNG', '963.PNG', '111.PNG', '166.PNG', '555.PNG', '666.PNG'];
    const baseGalleryUrl = "https://raw.githubusercontent.com/Yacine2007/Yacine2007/main/prtf/";
    const fallbackImg = "https://placehold.co/400x300/eef2fa/1e293b?text=Design+Preview";

    function loadGallery() {
        const container = document.getElementById('galleryGrid');
        container.innerHTML = '';
        originalImages.forEach(imgName => {
            const imgUrl = baseGalleryUrl + imgName;
            const div = document.createElement('div');
            div.className = 'gallery-img-card';
            const img = document.createElement('img');
            img.src = imgUrl;
            img.alt = 'design preview';
            img.setAttribute('data-src', imgUrl);
            img.onerror = function() { this.src = fallbackImg; this.setAttribute('data-src', fallbackImg); };
            div.appendChild(img);
            div.addEventListener('click', () => {
                const modal = document.getElementById('imageModal');
                const modalImg = document.getElementById('modalImage');
                modal.style.display = 'flex';
                modalImg.src = img.getAttribute('data-src') || img.src;
            });
            container.appendChild(div);
        });
    }

    function renderProjects(lang) {
        const projects = projectsData[lang];
        const grid = document.getElementById('projectsGrid');
        grid.innerHTML = '';
        projects.forEach(proj => {
            const card = document.createElement('div');
            card.className = 'project-card';
            const highlightHtml = proj.highlight ? `<span class="highlight-badge"><i class="fas fa-star"></i> Featured</span>` : '';
            card.innerHTML = `
                <div class="project-category"><i class="${proj.icon}"></i> ${proj.category}</div>
                <div class="project-title">
                    ${proj.title}
                    ${highlightHtml}
                </div>
                <div class="project-description">${proj.desc}</div>
                <a href="${proj.link}" target="_blank" class="project-link"><i class="fas fa-arrow-right"></i> Visit Project</a>
            `;
            grid.appendChild(card);
        });
    }

    function renderTech(lang) {
        const container = document.getElementById('techStack');
        const techs = techData[lang];
        container.innerHTML = '';
        techs.forEach(tech => {
            const icon = techIcons[tech] || 'fas fa-code';
            const span = document.createElement('span');
            span.className = 'tech-item';
            span.innerHTML = `<i class="${icon}"></i> ${tech}`;
            container.appendChild(span);
        });
    }

    function setLanguage(lang) {
        renderProjects(lang);
        renderTech(lang);
        document.getElementById('heroBio').innerText = bioText[lang];
        document.getElementById('freelanceText').innerHTML = freelanceTexts[lang];
        const ui = uiText[lang];
        document.getElementById('projectsTitle').innerHTML = `<i class="fas fa-layer-group"></i> ${ui.projectsTitle}`;
        document.getElementById('galleryTitle').innerHTML = `<i class="fas fa-images"></i> ${ui.galleryTitle}`;
        document.getElementById('techTitle').innerHTML = `<i class="fas fa-code"></i> ${ui.techTitle}`;
        document.getElementById('expBadge').innerHTML = `<i class="fas fa-trophy"></i> ${expYears}+ Years · Global Freelance`;
        const servContainer = document.getElementById('servicesList');
        const servArr = servicesList[lang];
        servContainer.innerHTML = servArr.map(s => `<span class="service-chip"><i class="fas fa-check-circle"></i> ${s}</span>`).join('');
        document.getElementById('sampleNote').innerHTML = sampleNoteText[lang];
    }

    const langSelect = document.getElementById('langSelect');
    langSelect.addEventListener('change', (e) => setLanguage(e.target.value));

    // modal close
    const modal = document.getElementById('imageModal');
    const closeModal = document.querySelector('.close-modal');
    closeModal.addEventListener('click', () => modal.style.display = 'none');
    modal.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') modal.style.display = 'none'; });

    setLanguage('en');
    loadGallery();
</script>
</body>
</html>
